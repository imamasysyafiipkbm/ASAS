<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASAS - Sistem Ujian</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#172033}
.card{width:min(420px,100%);background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #0001}
h1{text-align:center;color:#173b73}.sub{text-align:center;color:#667085;margin-bottom:24px}
label{display:block;font-weight:bold;margin:14px 0 6px}
input,select,button{width:100%;padding:12px;border-radius:8px;font-size:16px;box-sizing:border-box}
input,select{border:1px solid #ccd5e0}
button{border:0;background:#1769d2;color:#fff;font-weight:bold;margin-top:20px;cursor:pointer}
button:disabled{opacity:.6}
.msg{min-height:22px;margin-top:14px;font-size:14px}.error{color:#b42318}.ok{color:#067647}
.hidden{display:none}.info{background:#f8fafc;padding:15px;border-radius:8px;line-height:1.7}
</style>
</head>
<body>
<main class="card">
<section id="loginPanel">
<h1>ASAS</h1>
<p class="sub">Sistem Ujian Berbasis Web</p>
<form id="loginForm">
<label for="role">Jenis Login</label>
<select id="role">
<option value="siswa">Siswa</option>
<option value="admin">Administrator</option>
</select>

<label id="identifierLabel" for="identifier">NIS atau NISN</label>
<input id="identifier" type="text" placeholder="Masukkan NIS atau NISN" required>

<label for="password">Kata Sandi</label>
<input id="password" type="password" placeholder="Masukkan kata sandi" required>

<button id="loginButton" type="submit">Masuk</button>
<div id="message" class="msg"></div>
</form>
</section>

<section id="dashboard" class="hidden">
<h1>ASAS</h1>
<p class="sub" id="welcome"></p>
<div id="info" class="info"></div>
<button id="logout" type="button">Keluar</button>
</section>
</main>

<script>
const SUPABASE_URL = "https://mllgkysdhobmbvudpehx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4W8K2AIVm9DGa-4L53W0pw_VlXO3XTW";

const form=document.getElementById("loginForm");
const role=document.getElementById("role");
const identifier=document.getElementById("identifier");
const password=document.getElementById("password");
const label=document.getElementById("identifierLabel");
const message=document.getElementById("message");
const button=document.getElementById("loginButton");

function setMessage(text,type=""){
  message.textContent=text;
  message.className="msg "+type;
}

role.addEventListener("change",function(){
  const admin=role.value==="admin";
  label.textContent=admin?"Email Administrator":"NIS atau NISN";
  identifier.placeholder=admin?"Masukkan email administrator":"Masukkan NIS atau NISN";
  identifier.type=admin?"email":"text";
  setMessage("");
});

form.addEventListener("submit",async function(e){
  e.preventDefault();

  const id=identifier.value.trim();
  const pass=password.value;
  const selectedRole=role.value;

  if(!id||!pass){
    setMessage("Identitas dan kata sandi wajib diisi.","error");
    return;
  }

  button.disabled=true;
  button.textContent="Memeriksa...";
  setMessage("");

  try{
    const functionName=selectedRole==="admin"?"admin-login":"student-login";
    const body=selectedRole==="admin"
      ? {email:id,password:pass}
      : {identifier:id,password:pass};

    const response=await fetch(
      SUPABASE_URL+"/functions/v1/"+functionName,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_PUBLISHABLE_KEY
        },
        body:JSON.stringify(body)
      }
    );

    const result=await response.json();

    if(!response.ok||!result.ok){
      setMessage(result.message||"Login gagal.","error");
      return;
    }

    if(!result.session){
      setMessage("Login berhasil tetapi sesi tidak diterima.","error");
      return;
    }

    sessionStorage.setItem("asas_session",JSON.stringify(result.session));
    sessionStorage.setItem("asas_role",selectedRole);

    const user=result.user||result.student||{};
    document.getElementById("welcome").textContent=
      "Selamat datang, "+(user.full_name||user.name||id)+"!";

    const info=document.getElementById("info");
    info.innerHTML="";
    const add=(label,value)=>{
      const p=document.createElement("p");
      const b=document.createElement("strong");
      b.textContent=label+": ";
      p.appendChild(b);
      p.appendChild(document.createTextNode(value||"-"));
      info.appendChild(p);
    };

    add("Jenis akun",selectedRole==="admin"?"Administrator":"Siswa");
    add("Nama",user.full_name||user.name||id);

    if(selectedRole==="siswa"){
      add("NIS",user.nis);
      add("NISN",user.nisn);
    }

    document.getElementById("loginPanel").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
  }catch(err){
    console.error(err);
    setMessage("Tidak dapat terhubung ke server. Periksa koneksi dan coba lagi.","error");
  }finally{
    button.disabled=false;
    button.textContent="Masuk";
  }
});

document.getElementById("logout").addEventListener("click",function(){
  sessionStorage.removeItem("asas_session");
  sessionStorage.removeItem("asas_role");
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("loginPanel").classList.remove("hidden");
  form.reset();
  role.dispatchEvent(new Event("change"));
});
</script>
</body>
</html>
