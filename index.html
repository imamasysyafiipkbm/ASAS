<style>

.official-logo{display:block;width:118px;height:118px;object-fit:contain;margin:0 auto 12px}.copyright{font-size:11px;color:#8792a2;text-align:center;line-height:1.5;margin:12px 0 0}.top-brand{display:flex;align-items:center;gap:10px}.top-brand small{font-size:11px;font-weight:500;color:var(--muted);display:block}.top-logo{width:42px;height:42px;object-fit:contain}.app{min-height:100vh}.topbar{height:68px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.top-brand{font-size:23px;font-weight:800;color:var(--navy);letter-spacing:.5px}.top-right{display:flex;align-items:center;gap:14px;font-size:14px}.role-pill{background:#eaf2ff;color:#1757a6;padding:7px 10px;border-radius:20px;font-weight:700}.logout{border:1px solid #d0d9e5;background:white;border-radius:8px;padding:9px 12px;color:#344054;font-weight:700}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:var(--navy);padding:22px 14px;color:#fff}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#b9c9dc;padding:0 12px;margin:8px 0 12px}.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:9px;padding:12px;color:#e8f0fa;background:transparent;text-align:left;margin:3px 0;font-size:14px}.nav-btn:hover,.nav-btn.active{background:#244a73;color:#fff}.nav-icon{width:22px;text-align:center;font-size:17px}.main{padding:28px;min-width:0}.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}.page-title{font-size:27px;margin:0 0 8px;color:#142c49}.page-desc{color:var(--muted);margin:0 0 24px;line-height:1.5}.welcome-box{background:linear-gradient(120deg,#153b68,#1b65ad);color:white;padding:24px;border-radius:15px;margin-bottom:22px}.welcome-box h2{margin:0 0 8px;font-size:23px}.welcome-box p{margin:0;color:#e0ecfb;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat .label{font-size:13px;color:var(--muted);margin-bottom:10px}.stat .value{font-size:25px;font-weight:800;color:var(--navy)}.stat .hint{font-size:12px;color:#7b8798;margin-top:7px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px}.panel h3{margin:0 0 13px;font-size:17px}.panel p{color:#596579;line-height:1.65;margin:0}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;text-align:left;color:var(--text)}.quick-btn:hover{border-color:#9bbce8;background:#f8fbff}.quick-btn strong{display:block;margin:8px 0 5px}.quick-btn span{font-size:13px;color:var(--muted);line-height:1.45}.empty-note{background:#f8fafc;border:1px dashed #cbd5e1;padding:18px;border-radius:10px;color:#667085;line-height:1.6}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}.secondary{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;color:#344054}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.status-off{background:#fef3f2;color:#b42318}.table-meta{color:var(--muted);font-size:13px;margin:0 0 12px}.footer{color:#8792a2;font-size:12px;text-align:center;padding:15px 0 4px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:22px}}

/* Mode Ujian Fokus: sembunyikan navigasi aplikasi saat siswa mengerjakan ujian */
body.exam-focus{background:#f3f6fa;overflow-x:hidden}
body.exam-focus .topbar,body.exam-focus #sidebar{display:none!important}
body.exam-focus .layout{display:block!important;min-height:100vh}
body.exam-focus .main{padding:0!important;min-height:100vh;width:100%;max-width:none}
body.exam-focus #mainContent{padding:0!important;margin:0!important}
body.exam-focus #mainContent>.crumb,body.exam-focus #mainContent>.page-title,body.exam-focus #mainContent>.page-desc,body.exam-focus #mainContent>.footer{display:none!important}
body.exam-focus #studentExamArea{display:none!important}
body.exam-focus #examRunner{display:block!important;min-height:100vh;width:100%;margin:0;padding:clamp(10px,2.5vw,28px)}
body.exam-focus #examWorkArea{max-width:1050px;min-height:calc(100vh - 2*clamp(10px,2.5vw,28px));margin:0 auto;background:#fff;border:1px solid #dbe3ed;border-radius:14px;padding:clamp(16px,3vw,32px);box-shadow:0 4px 22px #17324d0a;display:flex;flex-direction:column}
body.exam-focus #examWorkArea>.toolbar:first-child{position:sticky;top:0;background:#fff;padding:8px 0 14px;border-bottom:1px solid #e5eaf0;z-index:2}
body.exam-focus #examTimer{font-size:clamp(20px,3vw,28px);font-variant-numeric:tabular-nums;color:#123b68;background:#edf4ff;border-radius:9px;padding:8px 12px;white-space:nowrap}
body.exam-focus #examQuestionArea{flex:1;font-size:clamp(16px,1.7vw,19px);line-height:1.75}
body.exam-focus #examQuestionArea label{background:#fff!important;display:flex!important;align-items:flex-start;gap:10px;line-height:1.55;padding:14px!important;border-color:#d8e0ea!important;cursor:pointer}
body.exam-focus #examQuestionArea label:has(input:checked){border-color:#2563eb!important;background:#eff6ff!important}
body.exam-focus #examQuestionArea input[type=radio]{width:18px;height:18px;flex:0 0 auto;margin-top:4px}
body.exam-focus #examWorkArea>.toolbar:not(:first-child){border-top:1px solid #e5eaf0;padding-top:16px;margin-top:18px}
body.exam-focus #examWorkArea>.toolbar:not(:first-child) button{width:auto;margin-top:0;min-height:44px}
body.exam-focus #examWorkArea #submitStudentExam{margin-left:auto}
@media(max-width:620px){body.exam-focus #examRunner{padding:8px}body.exam-focus #examWorkArea{min-height:calc(100vh - 16px);padding:15px;border-radius:10px}body.exam-focus #examWorkArea>.toolbar:not(:first-child){gap:7px}body.exam-focus #examWorkArea>.toolbar:not(:first-child) button{flex:1;padding:10px 8px;font-size:13px}body.exam-focus #examWorkArea #submitStudentExam{margin-left:0;flex-basis:100%}}

@page{size:A4 portrait;margin:8mm}
@media print{
  body.print-cards{background:#fff!important}
  body.print-cards *{visibility:hidden!important}
  body.print-cards #studentCardPreview,body.print-cards #studentCardPreview *{visibility:visible!important}
  body.print-cards #studentCardPreview{position:absolute!important;left:0!important;top:0!important;width:100%!important;display:block!important;padding:0!important;margin:0!important}
  body.print-cards #studentCardPreview .card-preview-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-auto-rows:85mm!important;gap:4mm!important}
  body.print-cards .exam-card{height:85mm!important;min-height:0!important;margin:0!important;padding:5mm!important;border:1px solid #222!important;border-radius:0!important;break-inside:avoid!important;page-break-inside:avoid!important;box-shadow:none!important}
  body.print-cards .exam-card:nth-child(6n){break-after:page!important;page-break-after:always!important}
}
</style>

<body>

  <main class="login-card">
    <h1 class="brand">ASAS</h1><p class="sub">Sistem Ujian Berbasis Web<br>PKBM Imam Asy-Syafi’i</p><p class="copyright">© 2026 PKBM Imam Asy-Syafi'i. Hak Cipta Dilindungi.</p>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = "https://mllgkysdhobmbvudpehx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4W8K2AIVm9DGa-4L53W0pw_VlXO3XTW";
const form = document.getElementById("loginForm");
const role = document.getElementById("role");
const identifier = document.getElementById("identifier");
const password = document.getElementById("password");
const identifierLabel = document.getElementById("identifierLabel");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
let currentUser = null;
let currentRole = null;
function setMessage(text, type="") { message.textContent = text; message.className = "msg " + type; }
role.addEventListener("change", function () {
  const isAdmin = role.value === "admin";
  identifierLabel.textContent = isAdmin ? "Email Administrator" : "NIS atau NISN";
  identifier.placeholder = isAdmin ? "Masukkan email administrator" : "Masukkan NIS atau NISN";
  identifier.type = isAdmin ? "email" : "text";
  identifier.autocomplete = isAdmin ? "username" : "username";
  setMessage("");
});
form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const enteredId = identifier.value.trim();
  const enteredPassword = password.value;
  const selectedRole = role.value;
  if (!enteredId || !enteredPassword) { setMessage("Identitas dan kata sandi wajib diisi.", "error"); return; }
  loginButton.disabled = true; loginButton.textContent = "Memeriksa..."; setMessage("");
  try {
    const functionName = selectedRole === "admin" ? "admin-login" : "student-login";
    const requestBody = selectedRole === "admin" ? { email: enteredId, password: enteredPassword } : { identifier: enteredId, password: enteredPassword };
    const response = await fetch(SUPABASE_URL + "/functions/v1/" + functionName, {
      method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY }, body: JSON.stringify(requestBody)
    });
    const result = await response.json();
    if (!response.ok || !result.ok) { setMessage(result.message || "Login gagal. Periksa identitas dan kata sandi.", "error"); return; }
    if (!result.session) { setMessage("Login berhasil tetapi sesi tidak diterima. Silakan coba lagi.", "error"); return; }
    sessionStorage.setItem("asas_session", JSON.stringify(result.session));
    sessionStorage.setItem("asas_role", selectedRole);
    currentRole = selectedRole; currentUser = result.user || result.student || {};
    sessionStorage.setItem("asas_user", JSON.stringify(currentUser));
    showApp();
  } catch (error) {
    console.error(error); setMessage("Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.", "error");
  } finally { loginButton.disabled = false; loginButton.textContent = "Masuk"; }
});
const pages = {
 dashboard: {title:"Dashboard",desc:"Ringkasan sistem ujian ASAS.",body:()=>currentRole==="admin"?`<section class="welcome-box"><h2>Selamat datang, ${escapeHtml(getUserName())}!</h2><p>Kelola data pendidikan, bank soal, jadwal, dan hasil ujian dari satu tempat.</p></section><section class="stats"><div class="stat"><div class="label">Tahun Ajaran Aktif</div><div class="value" style="font-size:24px">2026/2027</div><div class="hint">Semester Ganjil</div></div><div class="stat"><div class="label">Kelas</div><div class="value">12</div><div class="hint">Paket A, B, dan C</div></div><div class="stat"><div class="label">Mata Pelajaran</div><div class="value">46</div><div class="hint">Penempatan sesuai tingkat</div></div><div class="stat"><div class="label">Siswa</div><div class="value">—</div><div class="hint">Data dari database</div></div></section><section class="panel"><h3>Akses Cepat</h3><div class="quick-grid"><button class="quick-btn" data-go="students">♙<strong>Data Siswa</strong><span>Lihat, edit, dan hapus data siswa.</span></button><button class="quick-btn" data-go="addStudent">＋<strong>Tambah Siswa</strong><span>Tambah biodata dan akun login siswa.</span></button><button class="quick-btn" data-go="uploadStudents">⇧<strong>Upload Siswa</strong><span>Impor siswa dari Excel atau CSV.</span></button><button class="quick-btn" data-go="examCards">▤<strong>Cetak Kartu Ujian</strong><span>Buat username dan password kartu siswa.</span></button><button class="quick-btn" data-go="questions">✎<strong>Bank Soal</strong><span>Siapkan dan kelompokkan soal ujian.</span></button><button class="quick-btn" data-go="exams">▣<strong>Buat Ujian</strong><span>Atur soal, durasi, dan ketentuan ujian.</span></button><button class="quick-btn" data-go="sessions">▣<strong>Sesi Multi-Mapel</strong><span>Gabungkan beberapa mata pelajaran dalam satu sesi.</span></button></div></section>`:`<section class="welcome-box"><h2>Assalamualaikum, ${escapeHtml(getUserName())}!</h2><p>Selamat datang di Ruang Ujian PKBM Imam Asy-Syafi'i. Semoga kamu diberikan kemudahan dan kelancaran dalam mengerjakan ujian.</p></section><section class="panel"><h3>Ujian Saya</h3><p>Periksa ujian yang tersedia untuk akun dan kelasmu. Ujian hanya dapat dimulai ketika jadwalnya aktif.</p><button class="primary" style="width:auto" data-go="studentExams">Lihat Jadwal Ujian</button><div class="hint" style="text-align:left">Jika belum ada ujian, pastikan administrator sudah mengatur peserta, jadwal, dan status ujian.</div></section>`},
 studentExams:{title:"Ujian Saya",desc:"Daftar ujian dan ruang pengerjaan ujian.",body:()=>`<section class="panel"><div class="toolbar"><button id="reloadStudentExams" class="secondary" type="button">Muat Ulang</button></div><p id="studentExamMeta" class="table-meta">Memuat jadwal ujian...</p><div id="studentExamArea" class="empty-note">Sedang memeriksa kelas dan jadwal ujian akun ini.</div><div id="examRunner" class="hidden"></div></section>`},
 students:{title:"Data Siswa",desc:"Daftar siswa yang diambil langsung dari database Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="studentSearch" type="search" placeholder="Cari NIS, NISN, atau nama siswa..."><button id="reloadStudents" class="secondary" type="button">Muat Ulang</button></div><p id="studentMeta" class="table-meta">Menghubungkan ke database...</p><div id="studentTableArea" class="empty-note">Sedang mengambil data siswa dari Supabase.</div></section>`},
 addStudent:{title:"Tambah Siswa",desc:"Masukkan biodata siswa dan buat akun login ASAS.",body:()=>studentFormMarkup()},
 uploadStudents:{title:"Upload Siswa",desc:"Impor banyak siswa melalui Excel atau CSV dengan pratinjau dan pemeriksaan duplikasi.",body:()=>`<section class="panel"><h3>Upload Data Siswa</h3><p>Gunakan template yang disediakan. Kolom orang tua dipisah menjadi Nama Ayah, No. HP Ayah, Nama Ibu, dan No. HP Ibu. Kolom wajib: NIS dan Nama Lengkap.</p><div class="toolbar"><button id="downloadStudentTemplate" class="secondary" type="button">Unduh Template Excel</button><input id="studentImportFile" type="file" accept=".xlsx,.xls,.csv,text/csv" style="max-width:360px"></div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="importStudentClass">Kelas untuk semua siswa (opsional)</label><select id="importStudentClass"><option value="">Pilih kelas bila diperlukan</option></select></div><div><label class="field-label" for="importStudentYear">Tahun ajaran (opsional)</label><select id="importStudentYear"><option value="">Pilih tahun ajaran bila diperlukan</option></select></div></div><div class="toolbar" style="margin-top:14px"><button id="previewStudentImport" class="secondary" type="button">Periksa File</button><button id="saveStudentImport" class="primary" style="width:auto;margin:0" type="button" disabled>Simpan Semua Siswa</button></div><p id="studentImportMeta" class="table-meta">Belum ada file dipilih.</p><div id="studentImportPreview" class="empty-note">Pilih file untuk melihat pratinjau.</div><div id="studentImportMessage" class="msg" role="status"></div></section>`},
 examCards:{title:"Cetak Kartu Ujian",desc:"Terbitkan kartu ujian berisi identitas, username, dan password siswa.",body:()=>`<section class="panel"><div class="toolbar"><label class="field-label" for="cardLogoUrl" style="margin:0;min-width:110px">Logo PKBM (URL)</label><input id="cardLogoUrl" type="url" placeholder="Tempel URL logo resmi PKBM"><button id="saveCardLogo" class="secondary" type="button">Simpan Logo</button></div><p class="hint" style="margin-bottom:12px">Logo akan dicetak di sisi kiri kop. Jika URL belum diisi, kartu menampilkan tempat logo sementara.</p><p>Password lama tidak dapat dibaca dari Supabase Auth. Saat menerbitkan kartu, sistem akan membuat password baru dan mengaturnya untuk akun siswa yang dipilih.</p><div class="toolbar"><select id="cardClassFilter"><option value="">Semua kelas</option></select><input id="cardSearch" type="search" placeholder="Cari nama, NIS, atau NISN..."><button id="reloadCardStudents" class="secondary" type="button">Muat Ulang</button></div><div class="toolbar"><label><input id="cardSelectAll" type="checkbox" style="width:auto"> Pilih semua yang tampil</label><button id="issueStudentCards" class="primary" style="width:auto;margin:0" type="button">Buat / Reset Password & Pratinjau Kartu</button></div><p id="cardStudentMeta" class="table-meta">Memuat siswa...</p><div id="cardStudentList" class="empty-note">Memuat daftar siswa...</div><div id="studentCardPreview" class="hidden"></div><div class="toolbar"><button id="printStudentCards" class="primary" style="width:auto;margin:0" type="button" disabled>Cetak Kartu (A4)</button></div><p id="cardMessage" class="msg" role="status"></p></section>`},
 recovery:{title:"Recovery Jawaban",desc:"Lihat salinan jawaban yang diamankan ketika siswa keluar dari layar penuh. Admin dapat memulihkan jika diperlukan.",body:()=>`<section class="panel"><div class="toolbar"><select id="recoveryStatus"><option value="pending">Menunggu / Belum dipulihkan</option><option value="restored">Sudah dipulihkan</option><option value="rejected">Ditolak (riwayat lama)</option><option value="all">Semua riwayat</option></select><button id="reloadRecoveries" class="secondary" type="button">Muat Ulang</button></div><p class="hint">Recovery otomatis tidak memerlukan persetujuan admin. Gunakan Pulihkan Jawaban hanya jika siswa mengajukan keberatan yang dinilai beralasan. Jika siswa sudah mengisi jawaban baru, jawaban baru akan disimpan dalam catatan audit sebelum salinan lama dikembalikan.</p><p id="recoveryMeta" class="table-meta">Memuat riwayat Recovery...</p><div id="recoveryList" class="empty-note">Memuat data...</div><div id="recoveryDetail" class="hidden" style="margin-top:18px"></div></section>`},
 classes:{title:"Data Kelas",desc:"Daftar kelas Paket A, Paket B, dan Paket C yang diambil dari Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="classSearch" type="search" placeholder="Cari nama kelas atau program..."><button id="reloadClasses" class="secondary" type="button">Muat Ulang</button></div><p id="classMeta" class="table-meta">Menghubungkan ke database...</p><div id="classTableArea" class="empty-note">Sedang mengambil data kelas dari Supabase.</div></section>`},
 alumni:{title:"Data Alumni",desc:"Arsip siswa yang telah menyelesaikan Paket A, Paket B, atau Paket C. Riwayat kelulusan disimpan tanpa menghapus biodata dan riwayat belajar siswa.",body:()=>`<section class="panel"><div class="toolbar"><select id="alumniProgramFilter" aria-label="Filter program"><option value="">Semua Paket</option><option value="PAKET_A">Paket A</option><option value="PAKET_B">Paket B</option><option value="PAKET_C">Paket C</option></select><select id="alumniYearFilter" aria-label="Filter tahun kelulusan"><option value="">Semua Tahun Kelulusan</option></select><input id="alumniSearch" type="search" placeholder="Cari nama, NIS, atau NISN..."><button id="reloadAlumni" class="secondary" type="button">Muat Ulang</button><button id="exportAlumni" class="primary" style="width:auto;margin:0" type="button">Ekspor Excel</button></div><p id="alumniMeta" class="table-meta">Menghubungkan ke database...</p><div id="alumniTableArea" class="empty-note">Sedang mengambil data alumni dari Supabase.</div></section><section class="panel"><h3>Informasi Arsip Alumni</h3><p>Satu siswa dapat memiliki lebih dari satu catatan kelulusan, misalnya lulus Paket A lalu melanjutkan hingga lulus Paket B. Tahun kelulusan dan tahun ajaran kelulusan dicatat pada setiap riwayat.</p></section>`},
 subjects:{title:"Mata Pelajaran",desc:"Daftar mata pelajaran yang diambil langsung dari database Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="subjectSearch" type="search" placeholder="Cari nama mata pelajaran..."><select id="subjectProgram" class="secondary"><option value="">Semua Paket</option><option value="A">Paket A</option><option value="B">Paket B</option><option value="C">Paket C</option></select><select id="subjectGrade" class="secondary"><option value="">Semua Tingkat</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">Kelas ${i+1}</option>`).join("")}</select><button id="reloadSubjects" class="secondary" type="button">Muat Ulang</button></div><p id="subjectMeta" class="table-meta">Menghubungkan ke database...</p><div id="subjectTableArea" class="empty-note">Sedang mengambil data mata pelajaran dari Supabase.</div></section>`},
 questions:{title:"Bank Soal",desc:"Buat dan kelola kumpulan soal berdasarkan paket, kelas, dan mata pelajaran.",body:()=>`<section class="panel"><div class="toolbar"><input id="questionBankSearch" type="search" placeholder="Cari bank soal..."/><button id="reloadQuestionBanks" class="secondary" type="button">Muat Ulang</button><button id="showAddQuestionBank" class="primary" style="width:auto;margin-top:0" type="button">+ Tambah Bank Soal</button></div><div id="questionBankFormWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px"><h3>Tambah Bank Soal</h3><form id="questionBankForm"><label class="field-label" for="qbName">Nama Bank Soal *</label><input id="qbName" required maxlength="150" placeholder="Contoh: PAI Paket A Kelas 1 Semester Ganjil"><label class="field-label" for="qbProgram">Paket *</label><select id="qbProgram" required><option value="PAKET_A">Paket A</option><option value="PAKET_B">Paket B</option><option value="PAKET_C">Paket C</option></select><label class="field-label" for="qbGrade">Tingkat Kelas *</label><select id="qbGrade" required></select><label class="field-label" for="qbSemester">Semester *</label><select id="qbSemester" required><option value="Ganjil">Ganjil</option><option value="Genap">Genap</option></select><label class="field-label" for="qbSubject">Mata Pelajaran *</label><select id="qbSubject" required><option value="">Memuat mata pelajaran...</option></select><label class="field-label" for="qbDescription">Keterangan</label><input id="qbDescription" maxlength="500" placeholder="Keterangan tambahan (opsional)"><div id="qbFormMessage" class="msg" role="status"></div><div class="toolbar"><button id="saveQuestionBank" class="primary" style="width:auto;margin-top:0" type="submit">Simpan Bank Soal</button><button id="cancelQuestionBank" class="secondary" type="button">Batal</button></div></form></div><p id="questionBankMeta" class="table-meta">Menghubungkan ke database...</p><div id="questionBankTableArea" class="empty-note">Sedang mengambil data bank soal dari Supabase.</div></section>
<section class="panel"><h3>Kelola Butir Soal</h3><p style="margin-bottom:14px">Bank soal dipisahkan menurut Paket, kelas, mata pelajaran, dan semester Ganjil/Genap. Bank semester yang sama dapat digunakan kembali pada tahun ajaran berikutnya. Soal yang disalin ke ujian menjadi snapshot tersendiri.</p>
<label class="field-label" for="questionTargetBank">Bank Soal *</label><select id="questionTargetBank"><option value="">Memuat bank soal...</option></select>
<div class="toolbar" style="margin-top:16px"><button id="toggleManualQuestion" class="primary" style="width:auto;margin-top:0" type="button">+ Ketik Soal Manual</button><button id="downloadQuestionCsv" class="secondary" type="button">Unduh Template CSV</button></div>
<div id="manualQuestionWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px"><h3>Tambah Soal Pilihan Ganda</h3><form id="manualQuestionForm">
<label class="field-label" for="manualQuestionText">Pertanyaan *</label><textarea id="manualQuestionText" required rows="4" style="width:100%;padding:12px;border:1px solid #ccd5e0;border-radius:9px;font:inherit" placeholder="Tulis pertanyaan di sini"></textarea>
<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="manualOptionA">Pilihan A *</label><input id="manualOptionA" required></div><div><label class="field-label" for="manualOptionB">Pilihan B *</label><input id="manualOptionB" required></div><div><label class="field-label" for="manualOptionC">Pilihan C *</label><input id="manualOptionC" required></div><div><label class="field-label" for="manualOptionD">Pilihan D *</label><input id="manualOptionD" required></div><div><label class="field-label" for="manualOptionE">Pilihan E (opsional)</label><input id="manualOptionE"></div></div>
<label class="field-label" for="manualCorrectAnswer">Kunci Jawaban *</label><select id="manualCorrectAnswer" required><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option></select>
<label class="field-label" for="manualPoints">Bobot Nilai</label><input id="manualPoints" type="number" min="0.01" step="any" value="1" required>
<div id="manualQuestionMessage" class="msg" role="status"></div><div class="toolbar"><button class="primary" id="saveManualQuestion" type="submit" style="width:auto;margin-top:0">Simpan Soal</button><button class="secondary" id="cancelManualQuestion" type="button">Batal</button></div></form></div>
<div style="border:1px solid var(--line);border-radius:10px;padding:18px"><h3>Impor Soal dari Excel/CSV</h3><p style="margin-bottom:12px">Kolom: No, Pertanyaan, A, B, C, D, Kunci, Bobot. Pilihan E bersifat opsional. Kunci harus sesuai pilihan yang tersedia (A–D atau A–E).</p><label class="field-label" for="questionImportFile">Pilih file Excel (.xlsx) atau CSV</label><input id="questionImportFile" type="file" accept=".xlsx,.xls,.csv,text/csv" style="padding:9px"><div class="toolbar"><button id="previewQuestionImport" class="secondary" type="button">Periksa File</button><button id="saveQuestionImport" class="primary" style="width:auto;margin-top:0" type="button" disabled>Simpan Semua Soal</button></div><p id="questionImportMeta" class="table-meta">Belum ada file dipilih.</p><div id="questionImportPreview" class="empty-note">Pilih file untuk melihat pratinjau sebelum disimpan.</div></div>
<section class="panel"><div class="toolbar"><h3 style="margin:0;flex:1">Daftar Butir Soal</h3><button id="reloadQuestions" class="secondary" type="button">Muat Ulang Soal</button><button id="resetQuestionBank" class="secondary" type="button" style="border-color:#b91c1c;color:#b91c1c">Kosongkan Soal di Bank Ini</button></div><p id="questionListMeta" class="table-meta">Pilih bank soal untuk menampilkan butir soal.</p><div id="questionListArea" class="empty-note">Pilih bank soal di atas.</div></section><div id="questionManagementMessage" class="msg" role="status"></div></section>`},
 exams:{title:"Ujian",desc:"Buat ujian dari bank soal dan tentukan kelas peserta.",body:()=>`<section class="panel"><div class="toolbar"><h3 style="margin:0;flex:1">Daftar Ujian</h3><button id="reloadExams" class="secondary" type="button">Muat Ulang</button><button id="toggleExamForm" class="primary" style="width:auto;margin:0" type="button">+ Buat Ujian</button></div><div id="examFormWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px"><h3 id="examFormTitle">Buat Ujian Baru</h3><form id="examForm"><input type="hidden" id="examEditId"><label class="field-label" for="examTitle">Nama Ujian *</label><input id="examTitle" required maxlength="180" placeholder="Contoh: ASAS PAI Paket A Kelas 1"><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="examYear">Tahun Ajaran *</label><select id="examYear" required></select></div><div><label class="field-label" for="examSubject">Mata Pelajaran *</label><select id="examSubject" required></select></div><div><label class="field-label" for="examProgram">Paket *</label><select id="examProgram" required><option value="PAKET_A">Paket A</option><option value="PAKET_B">Paket B</option><option value="PAKET_C">Paket C</option></select></div><div><label class="field-label" for="examGrade">Kelas *</label><select id="examGrade" required></select></div><div><label class="field-label" for="examDuration">Durasi (menit) *</label><input id="examDuration" type="number" min="1" max="600" value="60" required></div><div><label class="field-label" for="examBank">Bank Soal *</label><select id="examBank" required></select></div><div><label class="field-label" for="examPointsPerQuestion">Bobot setiap soal *</label><input id="examPointsPerQuestion" type="number" min="0.01" max="100" step="0.01" value="2.5" required><small class="hint">Bobot dibuat seragam dalam satu ujian.</small></div><div><label class="field-label" for="examQuestionCount">Jumlah soal per siswa *</label><input id="examQuestionCount" type="number" min="1" max="500" value="40" required readonly><small class="hint">Dihitung otomatis dari target nilai 100 ÷ bobot per soal.</small></div></div><div class="panel" style="margin-top:14px;background:#f8fbff"><strong>Ringkasan nilai</strong><p style="margin-top:8px">Target nilai 100 membutuhkan <strong id="examRequiredCount">40</strong> soal dengan bobot <strong id="examWeightSummary">2,5</strong> poin. Nilai maksimum ujian: <strong id="examMaxScore">100</strong>.</p><p class="hint" style="margin-top:6px">Sistem akan mengambil sejumlah soal secara acak dari kumpulan soal yang dipilih. Jumlah soal dihitung dari bobot agar nilai maksimal 100.</p></div><label class="field-label" for="examStart">Jadwal mulai</label><input id="examStart" type="datetime-local"><label class="field-label" for="examEnd">Jadwal selesai</label><input id="examEnd" type="datetime-local"><p style="margin:12px 0"><label><input id="examShuffleQ" type="checkbox" checked style="width:auto"> Acak urutan soal</label> &nbsp; <label><input id="examShuffleO" type="checkbox" checked style="width:auto"> Acak pilihan jawaban</label></p><label class="field-label">Pilih kumpulan soal kandidat dari bank *</label><div id="examQuestionPicker" class="empty-note">Pilih bank soal untuk memuat soal.</div><div id="examFormMessage" class="msg" role="status"></div><div class="toolbar"><button class="primary" style="width:auto;margin:0" type="submit">Simpan Ujian</button><button id="cancelExamForm" class="secondary" type="button">Batal</button></div></form></div><p id="examMeta" class="table-meta">Memuat daftar ujian...</p><div id="examTableArea" class="empty-note">Daftar ujian akan ditampilkan di sini.</div></section>`},
 sessions:{title:"Sesi Multi-Mapel",desc:"Susun beberapa mata pelajaran dalam satu sesi ujian dan tetapkan kelas peserta.",body:()=>`<section class="panel"><div class="toolbar"><h3 style="margin:0;flex:1">Buat Sesi Ujian</h3><button id="reloadSessions" class="secondary" type="button">Muat Ulang</button></div><form id="sessionForm"><label class="field-label" for="sessionTitle">Nama Sesi *</label><input id="sessionTitle" required maxlength="180" placeholder="Contoh: ASAS Semester Ganjil 2026/2027"><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="sessionYear">Tahun Ajaran *</label><select id="sessionYear" required></select></div><div><label class="field-label" for="sessionMode">Mode Pelaksanaan *</label><select id="sessionMode"><option value="scheduled">Gelombang terjadwal</option><option value="available_computer">Komputer tersedia</option></select></div><div><label class="field-label" for="sessionDevices">Jumlah komputer *</label><input id="sessionDevices" type="number" min="1" max="1000" value="20" required></div></div><label class="field-label">Pilih kelas peserta *</label><div id="sessionClassPicker" class="empty-note">Memuat kelas...</div><label class="field-label">Urutan mata pelajaran *</label><p class="hint" style="margin:0 0 8px">Pilih ujian yang sudah berstatus Aktif dan atur nomor urut setiap mata pelajaran.</p><div id="sessionExamPicker" class="empty-note">Memuat ujian...</div><div id="sessionFormMessage" class="msg" role="status"></div><div class="toolbar"><button class="primary" type="submit" style="width:auto;margin:0">Simpan Sesi sebagai Draft</button></div></form></section><section class="panel"><h3>Daftar Sesi</h3><p id="sessionMeta" class="table-meta">Memuat sesi...</p><div id="sessionTableArea" class="empty-note">Daftar sesi akan ditampilkan di sini.</div></section><section class="panel hidden" id="waveManagerPanel"><div class="toolbar"><h3 id="waveManagerTitle" style="margin:0;flex:1">Pengelolaan Gelombang</h3><button class="secondary" id="closeWaveManager" type="button">Tutup</button></div><p class="hint">Mode gelombang: gelombang berikutnya baru dapat dimulai setelah seluruh peserta gelombang sebelumnya menyelesaikan sesi. Kapasitas setiap gelombang dibatasi jumlah komputer.</p><form id="createWaveForm"><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="newWaveTitle">Nama Gelombang</label><input id="newWaveTitle" required maxlength="120" placeholder="Gelombang 1"></div><div><label class="field-label" for="newWaveStart">Waktu Mulai (opsional)</label><input id="newWaveStart" type="datetime-local"></div></div><button class="primary" type="submit" style="width:auto">Tambah Gelombang</button><p id="waveCreateMessage" class="msg" role="status"></p></form><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>Masukkan Peserta</h4><form id="assignWaveForm"><label class="field-label" for="waveTarget">Gelombang</label><select id="waveTarget" required></select><label class="field-label" for="waveStudentTarget">Siswa</label><select id="waveStudentTarget" required></select><button class="primary" type="submit" style="width:auto">Masukkan Siswa</button><p id="waveAssignMessage" class="msg" role="status"></p></form><div id="waveListArea" class="empty-note">Memuat gelombang...</div><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><h4>Komputer yang Sedang Digunakan</h4><div id="activeSlotsArea" class="empty-note">Memuat slot komputer...</div></section>`},
 schedule:{title:"Jadwal Ujian",desc:"Atur waktu dan kendalikan apakah ujian dapat diakses siswa.",body:()=>`<section class="panel"><div class="toolbar"><h3 style="margin:0;flex:1">Jadwal Ujian</h3><button id="reloadSchedules" class="secondary" type="button">Muat Ulang</button><button id="addSchedule" class="primary" style="width:auto;margin:0" type="button">+ Atur Jadwal</button><button id="clearScheduleTimes" class="secondary" style="border-color:#b91c1c;color:#b91c1c" type="button">Kosongkan Semua Waktu</button></div><div id="scheduleFormWrap" class="hidden" style="margin-bottom:18px"><label class="field-label" for="scheduleExam">Pilih Ujian *</label><select id="scheduleExam"></select><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="scheduleStart">Mulai *</label><input id="scheduleStart" type="datetime-local" required></div><div><label class="field-label" for="scheduleEnd">Selesai *</label><input id="scheduleEnd" type="datetime-local" required></div></div><div class="toolbar" style="margin-top:14px"><button id="saveSchedule" class="primary" style="width:auto;margin:0" type="button">Simpan Jadwal</button><button id="cancelSchedule" class="secondary" type="button">Batal</button></div><div id="scheduleMessage" class="msg" role="status"></div></div><p id="scheduleMeta" class="table-meta">Memuat jadwal...</p><div id="scheduleTableArea" class="empty-note">Jadwal akan ditampilkan di sini.</div></section>`},
 results:{title:"Hasil / Nilai",desc:"Lihat rekap nilai, periksa isian singkat/esai, dan telusuri riwayat perubahan nilai.",body:()=>`<section class="panel"><div class="toolbar"><select id="resultExamFilter"><option value="">Semua ujian</option></select><button id="reloadResults" class="secondary" type="button">Muat Ulang</button><button id="exportResults" class="primary" style="width:auto;margin:0" type="button">Ekspor CSV</button></div><p id="resultMeta" class="table-meta">Memuat hasil ujian...</p><div id="resultTableArea" class="empty-note">Hasil ujian akan ditampilkan di sini.</div></section><section class="panel"><div class="toolbar"><h3 style="margin:0;flex:1">Pemeriksaan Isian Singkat dan Esai</h3><button id="reloadManualGrading" class="secondary" type="button">Muat Ulang</button></div><p class="hint" style="margin-bottom:12px">Nilai yang diberikan akan tersimpan. Jika nilai diubah, perubahan sebelumnya dicatat di riwayat.</p><div id="manualGradingArea" class="empty-note">Memuat jawaban yang menunggu pemeriksaan...</div></section><section class="panel"><h3>Riwayat Perubahan Nilai</h3><div id="gradeHistoryArea" class="empty-note">Riwayat akan muncul setelah admin mengubah nilai manual.</div></section>`},
 promotion:{title:"Kenaikan Kelas",desc:"Pindahkan siswa ke tingkat berikutnya pada tahun ajaran baru tanpa menghapus riwayat kelas dan nilai sebelumnya.",body:()=>`<section class="panel"><h3>Proses Kenaikan Kelas</h3><p>Aturan kelulusan: Paket A selesai di kelas 6, Paket B selesai di kelas 9, dan Paket C selesai di kelas 12. Siswa yang lulus tidak dibuatkan enrollment kelas baru. Riwayat enrollment tahun sebelumnya tetap disimpan.</p><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="promotionSourceYear">Tahun ajaran asal *</label><select id="promotionSourceYear"></select></div><div><label class="field-label" for="promotionTargetYear">Tahun ajaran tujuan *</label><select id="promotionTargetYear"></select></div></div><div class="toolbar"><button id="previewPromotion" class="secondary" type="button">Pratinjau Kenaikan</button><button id="executePromotion" class="primary" style="width:auto;margin:0" type="button" disabled>Simpan Keputusan Tinggal Kelas</button></div><p id="promotionMeta" class="table-meta">Pilih semester Ganjil tahun asal dan semester Ganjil tahun tujuan. Centang siswa yang harus tinggal kelas; siswa lain akan naik otomatis saat tahun ajaran baru dimulai.</p><div id="promotionPreview" class="empty-note">Pratinjau belum dibuat.</div><p id="promotionMessage" class="msg" role="status"></p></section>`},

function escapeHtml(value){return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getUserName(){return currentUser?.full_name || currentUser?.name || currentUser?.email || "Admin ASAS";}

async function callStudentAccountFunction(payload){const token=getAccessToken();if(!token)throw new Error("Sesi administrator tidak ditemukan. Silakan login kembali.");const response=await fetch(SUPABASE_URL+"/functions/v1/"+STUDENT_ACCOUNT_FUNCTION,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify(payload)});const result=await response.json().catch(()=>({}));if(!response.ok||!result.ok)throw new Error(result.message||"Fungsi pengelolaan akun siswa gagal (HTTP "+response.status+").");return result;}
async function loadStudentLookups(classId="",yearId=""){const [classes,years]=await Promise.all([apiRequest("classes?select=id,name,program_code,grade_number&order=program_code,grade_number,name"),apiRequest("academic_years?select=id,name,semester&order=start_date.desc.nullsfirst")]);cachedStudentClasses=classes;cachedStudentYears=years;const classOptions='<option value="">Belum ditentukan</option>'+classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)} · ${escapeHtml(c.program_code)} · Kelas ${c.grade_number}</option>`).join("");const yearOptions='<option value="">Belum ditentukan</option>'+years.map(y=>`<option value="${y.id}">${escapeHtml(y.name)} · ${escapeHtml(y.semester)}</option>`).join("");["st_class_id","importStudentClass"].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML=classOptions;if(classId)el.value=classId;}});["st_year_id","importStudentYear"].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML=yearOptions;if(yearId)el.value=yearId;}});const filter=document.getElementById("cardClassFilter");if(filter)filter.innerHTML='<option value="">Semua kelas</option>'+classes.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");return {classes,years};}
function readStudentForm(){const obj={};studentFields.forEach(k=>{const el=document.getElementById("st_"+k);if(el)obj[k]=el.value.trim()||null;});obj.nis=document.getElementById("st_nis").value.trim();obj.full_name=document.getElementById("st_full_name").value.trim();return obj;}
async function setupAddStudentPage(){await loadStudentLookups();const form=document.getElementById("studentForm");form?.addEventListener("submit",saveStudentForm);document.getElementById("cancelStudentEdit")?.addEventListener("click",()=>{form.reset();document.getElementById("studentEditId").value="";document.getElementById("studentFormMessage").textContent="Form dibersihkan.";document.getElementById("saveStudent").textContent="Simpan Siswa dan Buat Akun";});}
async function saveStudentForm(event){event.preventDefault();const btn=document.getElementById("saveStudent"),msg=document.getElementById("studentFormMessage"),id=document.getElementById("studentEditId").value,data=readStudentForm(),classId=document.getElementById("st_class_id").value||null,yearId=document.getElementById("st_year_id").value||null,password=document.getElementById("st_password").value;btn.disabled=true;msg.className="msg";msg.textContent="Menyimpan data siswa...";try{if(id){await apiRequest("students?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(data)});if(classId&&yearId)await apiRequest("rpc/admin_assign_student_enrollment",{method:"POST",body:JSON.stringify({p_student_id:id,p_class_id:classId,p_academic_year_id:yearId})});msg.className="msg ok";msg.textContent="Biodata siswa berhasil diperbarui. Riwayat kelas lama tetap dipertahankan.";}else{const result=await callStudentAccountFunction({action:"create",student:data,class_id:classId,academic_year_id:yearId,password:password||null});msg.className="msg ok";msg.textContent=`Siswa dan akun berhasil dibuat. Username: ${data.nis}. Password awal: ${result.password}. Catat atau cetak kartu sekarang; password tidak dapat dibaca kembali.`;studentCardCredentials=[{student_id:result.student_id,nis:data.nis,nisn:data.nisn,full_name:data.full_name,password:result.password}];}await loadStudents();}catch(e){msg.className="msg error";msg.textContent="Gagal menyimpan siswa: "+e.message;}finally{btn.disabled=false;}}
function openStudentEdit(st){renderPage("addStudent");setTimeout(async()=>{await loadStudentLookups();document.getElementById("studentEditId").value=st.id;studentFields.forEach(k=>{const el=document.getElementById("st_"+k);if(el)el.value=st[k]??"";});document.getElementById("st_password").value="";document.getElementById("saveStudent").textContent="Simpan Perubahan Biodata";document.getElementById("studentFormMessage").textContent="Mode edit biodata. Password akun tidak diubah.";},0);}
function normalizeStudentImportRow(row){const keys=Object.keys(row),get=(...names)=>{const key=keys.find(k=>names.includes(k.trim().toLowerCase()));return key===undefined?"":String(row[key]??"").trim();};return {nis:get("nis","nis siswa"),nisn:get("nisn")||null,full_name:get("full_name","nama","nama lengkap") ,gender:get("gender","jenis kelamin")||null,birth_place:get("birth_place","tempat lahir")||null,birth_date:get("birth_date","tanggal lahir")||null,nik:get("nik")||null,address:get("address","alamat")||null,phone:get("phone","telepon","no hp siswa")||null,father_name:get("father_name","nama ayah","ayah")||null,father_phone:get("father_phone","no hp ayah","nomor hp ayah","telepon ayah")||null,mother_name:get("mother_name","nama ibu","ibu")||null,mother_phone:get("mother_phone","no hp ibu","nomor hp ibu","telepon ibu")||null,school_name:get("school_name","sekolah","nama sekolah")||null,school_class:get("school_class","kelas sekolah")||null,education_level:get("education_level","jenjang","jenjang / paket")||null,program_code:get("program_code","kode paket")||null,grade_number:get("grade_number","tingkat kelas")||null,academic_year:get("academic_year","tahun ajaran")||null,photo_url:get("photo_url")||null,age_group_code:get("age_group_code")||null,age_group:get("age_group")||null};}
async function setupUploadStudentsPage(){try{cachedStudents=await apiRequest("students?select=id,nis,nisn&order=full_name.asc");}catch(e){console.warn("Daftar siswa untuk validasi duplikat belum termuat:",e.message);}await loadStudentLookups();document.getElementById("previewStudentImport")?.addEventListener("click",previewStudentImport);document.getElementById("saveStudentImport")?.addEventListener("click",saveStudentImport);document.getElementById("downloadStudentTemplate")?.addEventListener("click",downloadStudentTemplate);}
async function previewStudentImport(){const file=document.getElementById("studentImportFile").files[0],area=document.getElementById("studentImportPreview"),meta=document.getElementById("studentImportMeta"),save=document.getElementById("saveStudentImport");if(!file){meta.textContent="Pilih file Excel/CSV terlebih dahulu.";return;}try{let raw=[];const ext=file.name.split(".").pop().toLowerCase();if(ext==="csv")raw=parseCSV(await file.text());else{if(!window.XLSX)throw new Error("Pembaca Excel belum termuat.");const wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:false});raw=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});}pendingImportedStudents=raw.map(normalizeStudentImportRow).filter(x=>x.nis||x.full_name).map(x=>{const p=String(x.program_code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");const grade=Number(x.grade_number||0);const yearName=String(x.academic_year||"").trim().toLowerCase();const klass=cachedStudentClasses.find(c=>{const cp=String(c.program_code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");return (!p||cp===p||cp.endsWith(p)||p.endsWith(cp))&&(!grade||Number(c.grade_number)===grade);});const year=cachedStudentYears.find(y=>String(y.name||"").trim().toLowerCase()===yearName);return {...x,_class_id:klass?.id||null,_year_id:year?.id||null};});const seenNis=new Set(),seenNisn=new Set(),knownNis=new Set(cachedStudents.map(x=>String(x.nis||"").toLowerCase())),knownNisn=new Set(cachedStudents.map(x=>String(x.nisn||"").toLowerCase()).filter(Boolean));const checked=pendingImportedStudents.map((s,i)=>{let issue=[];if(!s.nis)issue.push("NIS kosong");if(!s.full_name)issue.push("Nama kosong");const n=s.nis.toLowerCase(),nn=String(s.nisn||"").toLowerCase();if(n&& (seenNis.has(n)||knownNis.has(n)))issue.push("NIS duplikat");if(nn&& (seenNisn.has(nn)||knownNisn.has(nn)))issue.push("NISN duplikat");if(n)seenNis.add(n);if(nn)seenNisn.add(nn);return {...s,_row:i+2,_issue:issue.join(", ")}});pendingImportedStudents=checked;const invalid=checked.filter(x=>x._issue);meta.textContent=`Ditemukan ${checked.length} siswa; ${invalid.length} baris perlu diperbaiki.`;area.className=invalid.length?"empty-note":"table-wrap";area.innerHTML=`<table><thead><tr><th>Baris</th><th>NIS</th><th>NISN</th><th>Nama</th><th>Jenis Kelamin</th><th>Status</th></tr></thead><tbody>${checked.slice(0,150).map(x=>`<tr><td>${x._row}</td><td>${escapeHtml(x.nis)}</td><td>${escapeHtml(x.nisn||"—")}</td><td>${escapeHtml(x.full_name)}</td><td>${escapeHtml(x.gender||"—")}</td><td>${escapeHtml(x._issue||"Siap")}</td></tr>`).join("")}</tbody></table>${checked.length>150?`<p class="table-meta">Pratinjau menampilkan 150 baris pertama dari ${checked.length}.</p>`:""}`;save.disabled=!checked.length||invalid.length>0;}catch(e){pendingImportedStudents=[];save.disabled=true;area.className="empty-note";area.textContent=e.message;meta.textContent="File belum dapat diperiksa.";}}
async function saveStudentImport(){const btn=document.getElementById("saveStudentImport"),msg=document.getElementById("studentImportMessage"),classId=document.getElementById("importStudentClass").value||null,yearId=document.getElementById("importStudentYear").value||null;if(!pendingImportedStudents.length)return;btn.disabled=true;let success=0,failed=[];studentCardCredentials=[];for(const s of pendingImportedStudents){try{const data={...s};const rowClass=data._class_id||classId,rowYear=data._year_id||yearId;["_row","_issue","_class_id","_year_id","program_code","grade_number","academic_year"].forEach(k=>delete data[k]);const result=await callStudentAccountFunction({action:"create",student:data,class_id:rowClass,academic_year_id:rowYear,password:null});studentCardCredentials.push({student_id:result.student_id,nis:data.nis,nisn:data.nisn,full_name:data.full_name,password:result.password});success++;document.getElementById("studentImportMeta").textContent=`Membuat akun ${success+failed.length} dari ${pendingImportedStudents.length}...`;}catch(e){failed.push(`Baris ${s._row} (${s.nis}): ${e.message}`);}}msg.className=failed.length?"msg error":"msg ok";msg.textContent=`Berhasil: ${success}. Gagal: ${failed.length}. Password siswa yang berhasil dibuat tersedia sementara di memori halaman ini; buka Cetak Kartu Ujian untuk mencetaknya atau terbitkan ulang password.`+(failed.length?" Detail: "+failed.slice(0,8).join(" | "):"");await loadStudents();pendingImportedStudents=[];btn.disabled=true;}

async function deleteStudentPermanently(studentId,studentName,button){

 if(button)button.disabled=true;
 try{
  await apiRequest("rpc/admin_delete_student_permanently",{method:"POST",body:JSON.stringify({p_student_id:studentId})});
  alert(`Data ${label} berhasil dihapus permanen.`);
  await loadStudents();
 }catch(error){console.error("Gagal menghapus siswa:",error);alert("Siswa tidak dapat dihapus: "+error.message);if(button)button.disabled=false;}
}

function drawSubjectsTable(){

 const program=document.getElementById("subjectProgram")?.value||"";const gradeValue=document.getElementById("subjectGrade")?.value||"";const grade=gradeValue?Number(gradeValue):null;

function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++;}else if(c==='"'){quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field="";}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);row=[];field="";}else field+=c;}row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);if(rows.length<2)return [];const headers=rows[0].map(h=>String(h).trim().replace(/^\uFEFF/,''));return rows.slice(1).map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]??""])));}

async function onExamFullscreenChange(){

    // Tunggu seluruh autosave yang sudah masuk antrean selesai sebelum snapshot.
    await flushAutosaveQueue();

    alert(msg);
  }catch(e){
    // Jika gagal, jawaban yang ada di server tidak dihapus. Buka kembali kontrol.
    examRecoveryLocked=false;setExamRunnerLocked(false);
    alert("Recovery gagal dijalankan. Jawaban server tetap dipertahankan. Jangan tutup halaman; hubungi pengawas. Detail: "+e.message);
  }finally{examRecoveryBusy=false;}
}

    const created=await apiRequest("exam_sessions?select=id",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({title:document.getElementById("sessionTitle").value.trim(),academic_year_id:yearId,status:"draft",execution_mode:mode,device_count:devices})});
    const session=Array.isArray(created)?created[0]:created;if(!session?.id)throw new Error("ID sesi tidak diterima dari database.");
    await apiRequest("exam_session_classes",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(classIds.map(class_id=>({session_id:session.id,class_id})))});
    const selected=examIds.map(x=>({...sessionExams.find(e=>e.id===x.id),sequence_number:x.order})).filter(e=>e.id).sort((a,b)=>a.sequence_number-b.sequence_number);
    await apiRequest("exam_session_items",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(selected.map(e=>({session_id:session.id,exam_id:e.id,sequence_number:e.sequence_number,duration_minutes:Math.min(60,Math.max(1,Number(e.duration_minutes)||60))})))});
    msg.className="msg ok";msg.textContent="Sesi tersimpan sebagai Draft. Periksa daftar kelas dan urutan mapel, lalu aktifkan dari daftar sesi.";document.getElementById("sessionForm").reset();await loadSessionPickers();await loadSessions();
  }catch(e){msg.className="msg error";msg.textContent="Sesi mungkin sudah terbentuk sebagian dan tetap dibiarkan sebagai Draft agar data tidak terhapus. Periksa daftar sesi. Detail: "+e.message;await loadSessions();}
  finally{btn.disabled=false;}
}
async function loadSessions(){
  const area=document.getElementById("sessionTableArea"),meta=document.getElementById("sessionMeta");if(!area)return;
  try{
    const rows=await apiRequest("exam_sessions?select=id,title,status,execution_mode,device_count,academic_year_id,created_at&order=created_at.desc");
    const years=await apiRequest("academic_years?select=id,name,semester");const items=await apiRequest("exam_session_items?select=session_id,sequence_number,duration_minutes,exam_id&order=sequence_number.asc");
    meta.textContent="Jumlah sesi: "+rows.length;
    if(!rows.length){area.className="empty-note";area.textContent="Belum ada sesi multi-mapel.";return;}
    area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Sesi</th><th>Tahun Ajaran</th><th>Mapel</th><th>Mode / Komputer</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows.map(r=>{const y=years.find(x=>x.id===r.academic_year_id),it=items.filter(x=>x.session_id===r.id).sort((a,b)=>a.sequence_number-b.sequence_number);return `<tr><td><strong>${escapeHtml(r.title)}</strong></td><td>${escapeHtml(y?.name||"-")} ${escapeHtml(y?.semester||"")}</td><td>${it.length}</td><td>${r.execution_mode==="available_computer"?"Komputer tersedia":"Gelombang"} · ${r.device_count}</td><td>${r.status==="published"?"Aktif":"Draft"}</td><td>${r.execution_mode==="scheduled"?`<button class="secondary" style="width:auto;margin:2px" data-manage-waves="${r.id}" data-session-title="${escapeHtml(r.title)}" data-session-devices="${r.device_count}">Gelombang</button>`:"—"} ${r.status==="draft"&&it.length?`<button class="primary" style="width:auto;margin:2px" data-publish-session="${r.id}" data-execution-mode="${r.execution_mode}">Aktifkan</button>`:""}</td></tr>`;}).join("")}</tbody></table>`;
    area.querySelectorAll("[data-publish-session]").forEach(b=>b.addEventListener("click",async()=>{if(!confirm("Aktifkan sesi ini agar dapat dikerjakan siswa? Pastikan kelas, urutan mapel, dan gelombang sudah benar."))return;try{if(b.dataset.executionMode==="scheduled"){const waves=await apiRequest("rpc/admin_list_exam_session_waves",{method:"POST",body:JSON.stringify({p_session_id:b.dataset.publishSession})});const eligible=await apiRequest("rpc/admin_list_exam_session_eligible_students",{method:"POST",body:JSON.stringify({p_session_id:b.dataset.publishSession})});const waveRows=Array.isArray(waves)?waves:[],eligibleRows=Array.isArray(eligible)?eligible:[];if(!waveRows.length||!eligibleRows.length)throw new Error("Buat minimal satu gelombang dan pastikan kelas sesi memiliki siswa aktif.");let assigned=[];for(const w of waveRows){const members=await apiRequest("rpc/admin_list_exam_wave_students",{method:"POST",body:JSON.stringify({p_wave_id:w.wave_id})});if(!Array.isArray(members)||!members.length)throw new Error(`${w.title} masih kosong. Isi seluruh gelombang sebelum mengaktifkan sesi.`);assigned.push(...members.map(x=>x.student_id));}if(new Set(assigned).size!==eligibleRows.length)throw new Error("Masih ada siswa kelas peserta yang belum dimasukkan ke gelombang. Pastikan semua siswa sudah dibagi.");}await apiRequest("exam_sessions?id=eq."+encodeURIComponent(b.dataset.publishSession),{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:"published"})});await loadSessions();}catch(e){alert("Sesi belum diaktifkan: "+e.message);}}));
    area.querySelectorAll("[data-manage-waves]").forEach(b=>b.addEventListener("click",()=>openExamWaveManager(b.dataset.manageWaves,b.dataset.sessionTitle,b.dataset.sessionDevices)));
  }catch(e){area.className="empty-note";area.textContent="Gagal memuat sesi: "+e.message;meta.textContent="Periksa izin admin untuk exam_sessions, exam_session_classes, dan exam_session_items.";}
}

let activeWaveSessionId=null,activeWaveSessionTitle="",activeWaveDeviceCount=0;
async function openExamWaveManager(sessionId,title,deviceCount){
  activeWaveSessionId=sessionId;activeWaveSessionTitle=title||"Sesi";activeWaveDeviceCount=Number(deviceCount)||1;
  const panel=document.getElementById("waveManagerPanel");if(!panel)return;panel.classList.remove("hidden");
  document.getElementById("waveManagerTitle").textContent=`Gelombang — ${activeWaveSessionTitle} (${activeWaveDeviceCount} komputer)`;
  document.getElementById("newWaveTitle").value="Gelombang "+(1);
  await loadExamWaveManager();
}
async function loadExamWaveManager(){
  if(!activeWaveSessionId)return;
  const list=document.getElementById("waveListArea"),slots=document.getElementById("activeSlotsArea"),waveSelect=document.getElementById("waveTarget"),studentSelect=document.getElementById("waveStudentTarget");
  list.className="empty-note";list.textContent="Memuat gelombang dan peserta...";
  try{
    const [waves,eligible,slotsData]=await Promise.all([
      apiRequest("rpc/admin_list_exam_session_waves",{method:"POST",body:JSON.stringify({p_session_id:activeWaveSessionId})}),
      apiRequest("rpc/admin_list_exam_session_eligible_students",{method:"POST",body:JSON.stringify({p_session_id:activeWaveSessionId})}),
      apiRequest("rpc/admin_list_active_exam_session_slots",{method:"POST",body:JSON.stringify({p_session_id:activeWaveSessionId})})
    ]);
    const waveRows=Array.isArray(waves)?waves:[],studentRows=Array.isArray(eligible)?eligible:[],slotRows=Array.isArray(slotsData)?slotsData:[];
    const assignedByWave=await Promise.all(waveRows.map(w=>apiRequest("rpc/admin_list_exam_wave_students",{method:"POST",body:JSON.stringify({p_wave_id:w.wave_id})}).then(a=>({wave:w,students:Array.isArray(a)?a:[]}))));
    const assignedIds=new Set(assignedByWave.flatMap(x=>x.students.map(y=>y.student_id)));
    const unassigned=studentRows.filter(x=>!assignedIds.has(x.student_id));
    waveSelect.innerHTML=waveRows.map(w=>`<option value="${w.wave_id}">${escapeHtml(w.title)} · ${w.student_count}/${activeWaveDeviceCount} peserta · ${escapeHtml(w.status)}</option>`).join("");
    studentSelect.innerHTML=unassigned.map(st=>`<option value="${st.student_id}">${escapeHtml(st.full_name)} · ${escapeHtml(st.nis||"-")} · ${escapeHtml(st.class_name||"")}</option>`).join("");
    document.querySelector('#assignWaveForm button[type="submit"]').disabled=!waveRows.length||!unassigned.length;
    list.className=waveRows.length?"":"empty-note";
    list.innerHTML=waveRows.length?assignedByWave.map(({wave,students})=>`<div class="panel" style="margin:12px 0"><div class="toolbar"><strong style="flex:1">${escapeHtml(wave.title)} · Gelombang ${wave.wave_number}</strong><span class="status">${escapeHtml(wave.status)}</span><button class="secondary" type="button" data-delete-wave="${wave.wave_id}" data-wave-title="${escapeHtml(wave.title)}">Hapus Gelombang</button></div><p class="hint">${wave.student_count}/${activeWaveDeviceCount} peserta · ${wave.completed_count} selesai${wave.start_at?" · Mulai "+escapeHtml(new Date(wave.start_at).toLocaleString("id-ID")):""}</p>${students.length?`<div class="table-wrap"><table><thead><tr><th>Siswa</th><th>NIS</th><th>Progres</th><th></th></tr></thead><tbody>${students.map(st=>`<tr><td>${escapeHtml(st.full_name)}</td><td>${escapeHtml(st.nis||"-")}</td><td>${st.progress_status==="completed"?"Selesai":st.progress_status==="in_progress"?"Berjalan":"Belum mulai"}</td><td>${st.progress_status==="not_started"?`<button class="secondary" type="button" data-remove-wave-student="${wave.wave_id}" data-remove-student="${st.student_id}">Keluarkan</button>`:"—"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="hint">Belum ada peserta.</p>`}</div>`).join(""):`Belum ada gelombang. Buat gelombang terlebih dahulu.`;
     list.querySelectorAll("[data-delete-wave]").forEach(btn=>btn.addEventListener("click",async()=>{const title=btn.dataset.waveTitle||"gelombang";const choice=prompt(`Pilih cara menghapus ${title}:\n\n1 = Hapus gelombang dan daftar pesertanya saja. Progres, jawaban, percobaan, dan nilai tetap disimpan.\n\n2 = Hapus gelombang beserta seluruh data ujian peserta gelombang ini pada sesi tersebut, termasuk progres, jawaban, percobaan, Recovery, audit, dan nilai.\n\nKetik 1 atau 2.`);if(choice!=="1"&&choice!=="2")return;const full=choice==="2";const detail=full?"SELURUH DATA UJIAN peserta gelombang ini pada sesi tersebut akan dihapus permanen.":"Hanya gelombang dan daftar pesertanya yang dihapus; riwayat ujian tetap ada.";if(!confirm(`Konfirmasi penghapusan ${title}.\n\n${detail}\n\nTindakan tidak dapat dibatalkan.`))return;const typed=prompt("Ketik HAPUS untuk melanjutkan:");if(typed!=="HAPUS")return;btn.disabled=true;try{await apiRequest("rpc/admin_delete_exam_session_wave",{method:"POST",body:JSON.stringify({p_wave_id:btn.dataset.deleteWave,p_delete_exam_data:full})});await loadExamWaveManager();}catch(e){alert("Gelombang tidak dapat dihapus: "+e.message);btn.disabled=false;}}));
    list.querySelectorAll("[data-remove-wave-student]").forEach(btn=>btn.addEventListener("click",async()=>{if(!confirm("Keluarkan siswa ini dari gelombang?"))return;try{await apiRequest("rpc/admin_remove_student_from_exam_wave",{method:"POST",body:JSON.stringify({p_wave_id:btn.dataset.removeWaveStudent,p_student_id:btn.dataset.removeStudent})});await loadExamWaveManager();}catch(e){alert("Tidak dapat mengeluarkan siswa: "+e.message);}}));
    slots.className=slotRows.length?"":"empty-note";
    slots.innerHTML=slotRows.length?`<div class="table-wrap"><table><thead><tr><th>Siswa</th><th>NIS</th><th>Mulai menggunakan</th><th>Aksi</th></tr></thead><tbody>${slotRows.map(st=>`<tr><td>${escapeHtml(st.full_name)}</td><td>${escapeHtml(st.nis||"-")}</td><td>${escapeHtml(new Date(st.claimed_at).toLocaleString("id-ID"))}</td><td><button class="secondary" type="button" data-release-slot="${st.student_id}">Lepas Slot</button></td></tr>`).join("")}</tbody></table></div>`:"Tidak ada komputer yang sedang digunakan.";
    slots.querySelectorAll("[data-release-slot]").forEach(btn=>btn.addEventListener("click",async()=>{const reason=prompt("Alasan pelepasan slot (wajib diisi):");if(!reason?.trim())return;try{await apiRequest("rpc/admin_release_exam_session_slot",{method:"POST",body:JSON.stringify({p_session_id:activeWaveSessionId,p_student_id:btn.dataset.releaseSlot,p_reason:reason.trim()})});await loadExamWaveManager();}catch(e){alert("Slot tidak dapat dilepas: "+e.message);}}));
  }catch(e){list.className="msg error";list.textContent="Pengelolaan gelombang belum tersedia. Jalankan migrasi kapasitas dan gelombang terlebih dahulu. Detail: "+e.message;slots.className="empty-note";slots.textContent="Slot belum dapat dimuat.";}
}
async function createExamWave(event){
  event.preventDefault();if(!activeWaveSessionId)return;const msg=document.getElementById("waveCreateMessage"),title=document.getElementById("newWaveTitle").value.trim(),raw=document.getElementById("newWaveStart").value;
  try{await apiRequest("rpc/admin_create_exam_session_wave",{method:"POST",body:JSON.stringify({p_session_id:activeWaveSessionId,p_title:title,p_start_at:raw?new Date(raw).toISOString():null})});msg.className="msg ok";msg.textContent="Gelombang berhasil dibuat.";document.getElementById("newWaveTitle").value="Gelombang berikutnya";await loadExamWaveManager();}catch(e){msg.className="msg error";msg.textContent="Gagal membuat gelombang: "+e.message;}
}
async function assignExamWaveStudent(event){
  event.preventDefault();const waveId=document.getElementById("waveTarget").value,studentId=document.getElementById("waveStudentTarget").value,msg=document.getElementById("waveAssignMessage");
  if(!waveId||!studentId){msg.className="msg error";msg.textContent="Pilih gelombang dan siswa.";return;}
  try{await apiRequest("rpc/admin_assign_student_to_exam_wave",{method:"POST",body:JSON.stringify({p_wave_id:waveId,p_student_id:studentId})});msg.className="msg ok";msg.textContent="Siswa berhasil dimasukkan ke gelombang.";await loadExamWaveManager();}catch(e){msg.className="msg error";msg.textContent="Gagal memasukkan siswa: "+e.message;}
}

function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appScreen").classList.remove("hidden");document.getElementById("rolePill").textContent=currentRole==="admin"?"Administrator":"Siswa";document.getElementById("topUser").textContent=getUserName();const sidebar=document.getElementById("sidebar");sidebar.querySelectorAll("[data-page]").forEach(btn=>{const key=btn.dataset.page;btn.classList.toggle("hidden",currentRole==="admin"?key==="studentExams":!(key==="dashboard"||key==="studentExams"));});renderPage("dashboard");}
document.getElementById("sidebar").addEventListener("click",event=>{const btn=event.target.closest(".nav-btn[data-page]");if(!btn||btn.classList.contains("hidden"))return;event.preventDefault();renderPage(btn.dataset.page);});
document.getElementById("logoutButton").addEventListener("click",function(){sessionStorage.removeItem("asas_session");sessionStorage.removeItem("asas_role");sessionStorage.removeItem("asas_user");currentUser=null;currentRole=null;if(examDeadlineTimer)clearInterval(examDeadlineTimer);document.getElementById("appScreen").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");form.reset();role.dispatchEvent(new Event("change"));setMessage("Anda telah keluar dari sistem.","ok");});
role.dispatchEvent(new Event("change"));

// Pulihkan sesi yang tersimpan ketika halaman di-refresh.
(function restoreSession() {
  try {
    const savedSession = sessionStorage.getItem("asas_session");
    const savedRole = sessionStorage.getItem("asas_role");
    const savedUser = sessionStorage.getItem("asas_user");
    if (!savedSession || !savedRole) return;

    const parsedSession = JSON.parse(savedSession);
    if (!parsedSession || !parsedSession.access_token) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    // Jika waktu kedaluwarsa tersedia dan sudah lewat, minta login kembali.
    const expiresAt = parsedSession.expires_at;
    if (expiresAt && Date.now() >= Number(expiresAt) * 1000) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    currentRole = savedRole;
    currentUser = savedUser ? JSON.parse(savedUser) : {};
    showApp();
  } catch (error) {
    console.error("Tidak dapat memulihkan sesi ASAS:", error);
    sessionStorage.removeItem("asas_session");
    sessionStorage.removeItem("asas_role");
    sessionStorage.removeItem("asas_user");
  }
})();
</script>
