<style>
:root{--navy:#12345a;--blue:#1769d2;--bg:#f3f6fb;--text:#172033;--muted:#667085;--line:#e4eaf2;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);background:#fff;padding:30px;border-radius:18px;box-shadow:0 12px 34px #0d244014}.brand{text-align:center;color:var(--navy);font-size:32px;font-weight:800;letter-spacing:1px;margin:0}.sub{text-align:center;color:var(--muted);margin:8px 0 26px}.field-label{display:block;font-weight:700;margin:15px 0 7px}input,select{width:100%;padding:12px 13px;border:1px solid #ccd5e0;border-radius:9px;font-size:15px;background:white}button{font:inherit;cursor:pointer}.primary{width:100%;padding:12px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;margin-top:20px}.primary:disabled{opacity:.6}.msg{min-height:22px;margin-top:13px;font-size:14px}.error{color:#b42318}.ok{color:#067647}
.official-logo{display:block;width:118px;height:118px;object-fit:contain;margin:0 auto 12px}.copyright{font-size:11px;color:#8792a2;text-align:center;line-height:1.5;margin:12px 0 0}.top-brand{display:flex;align-items:center;gap:10px}.top-brand small{font-size:11px;font-weight:500;color:var(--muted);display:block}.top-logo{width:42px;height:42px;object-fit:contain}.app{min-height:100vh}.topbar{height:68px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;z-index:5}.top-brand{font-size:23px;font-weight:800;color:var(--navy);letter-spacing:.5px}.top-right{display:flex;align-items:center;gap:14px;font-size:14px}.role-pill{background:#eaf2ff;color:#1757a6;padding:7px 10px;border-radius:20px;font-weight:700}.logout{border:1px solid #d0d9e5;background:white;border-radius:8px;padding:9px 12px;color:#344054;font-weight:700}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 68px)}.sidebar{background:var(--navy);padding:22px 14px;color:#fff}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:#b9c9dc;padding:0 12px;margin:8px 0 12px}.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:9px;padding:12px;color:#e8f0fa;background:transparent;text-align:left;margin:3px 0;font-size:14px}.nav-btn:hover,.nav-btn.active{background:#244a73;color:#fff}.nav-icon{width:22px;text-align:center;font-size:17px}.main{padding:28px;min-width:0}.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}.page-title{font-size:27px;margin:0 0 8px;color:#142c49}.page-desc{color:var(--muted);margin:0 0 24px;line-height:1.5}.welcome-box{background:linear-gradient(120deg,#153b68,#1b65ad);color:white;padding:24px;border-radius:15px;margin-bottom:22px}.welcome-box h2{margin:0 0 8px;font-size:23px}.welcome-box p{margin:0;color:#e0ecfb;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat .label{font-size:13px;color:var(--muted);margin-bottom:10px}.stat .value{font-size:25px;font-weight:800;color:var(--navy)}.stat .hint{font-size:12px;color:#7b8798;margin-top:7px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px}.panel h3{margin:0 0 13px;font-size:17px}.panel p{color:#596579;line-height:1.65;margin:0}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;text-align:left;color:var(--text)}.quick-btn:hover{border-color:#9bbce8;background:#f8fbff}.quick-btn strong{display:block;margin:8px 0 5px}.quick-btn span{font-size:13px;color:var(--muted);line-height:1.45}.empty-note{background:#f8fafc;border:1px dashed #cbd5e1;padding:18px;border-radius:10px;color:#667085;line-height:1.6}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}.secondary{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;color:#344054}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.status-off{background:#fef3f2;color:#b42318}.table-meta{color:var(--muted);font-size:13px;margin:0 0 12px}.footer{color:#8792a2;font-size:12px;text-align:center;padding:15px 0 4px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}.main{padding:22px}}
@media(max-width:620px){.top-brand small{display:none}.top-logo{width:34px;height:34px}.topbar{padding:0 14px;height:60px}.top-brand{font-size:20px}.top-right{gap:7px}.top-user{display:none}.layout{display:block}.sidebar{padding:9px;display:flex;gap:5px;overflow-x:auto;position:sticky;top:60px;z-index:4}.side-label{display:none}.nav-btn{width:auto;flex:0 0 auto;margin:0;padding:10px;border-radius:8px}.nav-btn .nav-text{white-space:nowrap}.nav-icon{display:none}.main{padding:18px 13px}.page-title{font-size:24px}.stats{gap:9px}.stat{padding:13px}.stat .value{font-size:22px}.quick-grid{grid-template-columns:1fr}.welcome-box{padding:19px}.role-pill{font-size:12px}.logout{padding:8px}}
</style>

<body>
<div id="loginScreen" class="login-wrap">
  <main class="login-card">
    <img class="official-logo" src="https://raw.githubusercontent.com/imamasysyafiipkbm/ASAS/main/logo-PKMB.png" alt="Logo resmi PKBM Imam Asy-Syafi’i" onerror="this.style.display='none'"><h1 class="brand">ASAS</h1><p class="sub">Sistem Ujian Berbasis Web<br>PKBM Imam Asy-Syafi’i</p><p class="copyright">© 2026 PKBM Imam Asy-Syafi'i. Hak Cipta Dilindungi.</p>

</div>

<script>
const SUPABASE_URL = "https://mllgkysdhobmbvudpehx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4W8K2AIVm9DGa-4L53W0pw_VlXO3XTW";
const form = document.getElementById("loginForm");
const role = document.getElementById("role");
const identifier = document.getElementById("identifier");
const password = document.getElementById("password");
const identifierLabel = document.getElementById("identifierLabel");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");
let currentUser = null;
let currentRole = null;
function setMessage(text, type="") { message.textContent = text; message.className = "msg " + type; }
role.addEventListener("change", function () {
  const isAdmin = role.value === "admin";
  identifierLabel.textContent = isAdmin ? "Email Administrator" : "NIS atau NISN";
  identifier.placeholder = isAdmin ? "Masukkan email administrator" : "Masukkan NIS atau NISN";
  identifier.type = isAdmin ? "email" : "text";
  identifier.autocomplete = isAdmin ? "username" : "username";
  setMessage("");
});
form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const enteredId = identifier.value.trim();
  const enteredPassword = password.value;
  const selectedRole = role.value;
  if (!enteredId || !enteredPassword) { setMessage("Identitas dan kata sandi wajib diisi.", "error"); return; }
  loginButton.disabled = true; loginButton.textContent = "Memeriksa..."; setMessage("");
  try {
    const functionName = selectedRole === "admin" ? "admin-login" : "student-login";
    const requestBody = selectedRole === "admin" ? { email: enteredId, password: enteredPassword } : { identifier: enteredId, password: enteredPassword };
    const response = await fetch(SUPABASE_URL + "/functions/v1/" + functionName, {
      method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY }, body: JSON.stringify(requestBody)
    });
    const result = await response.json();
    if (!response.ok || !result.ok) { setMessage(result.message || "Login gagal. Periksa identitas dan kata sandi.", "error"); return; }
    if (!result.session) { setMessage("Login berhasil tetapi sesi tidak diterima. Silakan coba lagi.", "error"); return; }
    sessionStorage.setItem("asas_session", JSON.stringify(result.session));
    sessionStorage.setItem("asas_role", selectedRole);
    currentRole = selectedRole; currentUser = result.user || result.student || {};
    sessionStorage.setItem("asas_user", JSON.stringify(currentUser));
    showApp();
  } catch (error) {
    console.error(error); setMessage("Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.", "error");
  } finally { loginButton.disabled = false; loginButton.textContent = "Masuk"; }
});
const pages = {
 dashboard: {title:"Dashboard",desc:"Ringkasan sistem ujian ASAS.",body:()=>currentRole==="admin"?`<section class="welcome-box"><h2>Selamat datang, ${escapeHtml(getUserName())}!</h2><p>Kelola data pendidikan, bank soal, jadwal, dan hasil ujian dari satu tempat.</p></section><section class="stats"><div class="stat"><div class="label">Tahun Ajaran Aktif</div><div class="value" style="font-size:24px">2026/2027</div><div class="hint">Semester Ganjil</div></div><div class="stat"><div class="label">Kelas</div><div class="value">12</div><div class="hint">Paket A, B, dan C</div></div><div class="stat"><div class="label">Mata Pelajaran</div><div class="value">46</div><div class="hint">Penempatan sesuai tingkat</div></div><div class="stat"><div class="label">Siswa</div><div class="value">1</div><div class="hint">Data awal</div></div></section><section class="panel"><h3>Akses Cepat</h3><div class="quick-grid"><button class="quick-btn" data-go="students">♙<strong>Data Siswa</strong><span>Kelola data siswa dan impor Excel/CSV.</span></button><button class="quick-btn" data-go="questions">✎<strong>Bank Soal</strong><span>Siapkan dan kelompokkan soal ujian.</span></button><button class="quick-btn" data-go="exams">▣<strong>Buat Ujian</strong><span>Atur soal, durasi, dan ketentuan ujian.</span></button></div></section>`:`<section class="welcome-box"><h2>Assalamualaikum, ${escapeHtml(getUserName())}!</h2><p>Selamat datang di Ruang Ujian PKBM Imam Asy-Syafi'i. Semoga kamu diberikan kemudahan dan kelancaran dalam mengerjakan ujian.</p></section><section class="panel"><h3>Ujian Saya</h3><p>Periksa ujian yang tersedia untuk akun dan kelasmu. Ujian hanya dapat dimulai ketika jadwalnya aktif.</p><button class="primary" style="width:auto" data-go="studentExams">Lihat Jadwal Ujian</button><div class="hint" style="text-align:left">Jika belum ada ujian, pastikan administrator sudah mengatur peserta, jadwal, dan status ujian.</div></section>`},
 studentExams:{title:"Ujian Saya",desc:"Daftar ujian yang dijadwalkan untuk akun siswa ini.",body:()=>`<section class="panel"><div class="toolbar"><button id="reloadStudentExams" class="secondary" type="button">Muat Ulang</button></div><p id="studentExamMeta" class="table-meta">Memuat jadwal ujian...</p><div id="studentExamArea" class="empty-note">Sedang memeriksa kelas dan jadwal ujian akun ini.</div></section>`},
 students:{title:"Data Siswa",desc:"Daftar siswa yang diambil langsung dari database Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="studentSearch" type="search" placeholder="Cari NIS, NISN, atau nama siswa..."><button id="reloadStudents" class="secondary" type="button">Muat Ulang</button></div><p id="studentMeta" class="table-meta">Menghubungkan ke database...</p><div id="studentTableArea" class="empty-note">Sedang mengambil data siswa dari Supabase.</div></section>`},
 classes:{title:"Data Kelas",desc:"Daftar kelas Paket A, Paket B, dan Paket C yang diambil dari Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="classSearch" type="search" placeholder="Cari nama kelas atau program..."><button id="reloadClasses" class="secondary" type="button">Muat Ulang</button></div><p id="classMeta" class="table-meta">Menghubungkan ke database...</p><div id="classTableArea" class="empty-note">Sedang mengambil data kelas dari Supabase.</div></section>`},
 subjects:{title:"Mata Pelajaran",desc:"Daftar mata pelajaran yang diambil langsung dari database Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="subjectSearch" type="search" placeholder="Cari nama mata pelajaran..."><select id="subjectProgram" class="secondary"><option value="">Semua Paket</option><option value="A">Paket A</option><option value="B">Paket B</option><option value="C">Paket C</option></select><select id="subjectGrade" class="secondary"><option value="">Semua Tingkat</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">Kelas ${i+1}</option>`).join("")}</select><button id="reloadSubjects" class="secondary" type="button">Muat Ulang</button></div><p id="subjectMeta" class="table-meta">Menghubungkan ke database...</p><div id="subjectTableArea" class="empty-note">Sedang mengambil data mata pelajaran dari Supabase.</div></section>`},
 questions:{title:"Bank Soal",desc:"Buat dan kelola kumpulan soal berdasarkan paket, kelas, dan mata pelajaran.",body:()=>`<section class="panel"><div class="toolbar"><input id="questionBankSearch" type="search" placeholder="Cari bank soal..."/><button id="reloadQuestionBanks" class="secondary" type="button">Muat Ulang</button><button id="showAddQuestionBank" class="primary" style="width:auto;margin-top:0" type="button">+ Tambah Bank Soal</button></div><div id="questionBankFormWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px"><h3>Tambah Bank Soal</h3><form id="questionBankForm"><label class="field-label" for="qbName">Nama Bank Soal *</label><input id="qbName" required maxlength="150" placeholder="Contoh: PAI Paket A Kelas 1 Semester Ganjil"><label class="field-label" for="qbProgram">Paket *</label><select id="qbProgram" required><option value="PAKET_A">Paket A</option><option value="PAKET_B">Paket B</option><option value="PAKET_C">Paket C</option></select><label class="field-label" for="qbGrade">Tingkat Kelas *</label><select id="qbGrade" required></select><label class="field-label" for="qbSubject">Mata Pelajaran *</label><select id="qbSubject" required><option value="">Memuat mata pelajaran...</option></select><label class="field-label" for="qbDescription">Keterangan</label><input id="qbDescription" maxlength="500" placeholder="Keterangan tambahan (opsional)"><div id="qbFormMessage" class="msg" role="status"></div><div class="toolbar"><button id="saveQuestionBank" class="primary" style="width:auto;margin-top:0" type="submit">Simpan Bank Soal</button><button id="cancelQuestionBank" class="secondary" type="button">Batal</button></div></form></div><p id="questionBankMeta" class="table-meta">Menghubungkan ke database...</p><div id="questionBankTableArea" class="empty-note">Sedang mengambil data bank soal dari Supabase.</div></section>
<section class="panel"><h3>Kelola Butir Soal</h3><p style="margin-bottom:14px">Pilih bank soal, lalu tambahkan soal satu per satu atau impor banyak soal dari Excel/CSV.</p>
<label class="field-label" for="questionTargetBank">Bank Soal *</label><select id="questionTargetBank"><option value="">Memuat bank soal...</option></select>
<div class="toolbar" style="margin-top:16px"><button id="toggleManualQuestion" class="primary" style="width:auto;margin-top:0" type="button">+ Ketik Soal Manual</button><button id="downloadQuestionCsv" class="secondary" type="button">Unduh Template CSV</button></div>
<div id="manualQuestionWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px"><h3>Tambah Soal Pilihan Ganda</h3><form id="manualQuestionForm">
<label class="field-label" for="manualQuestionText">Pertanyaan *</label><textarea id="manualQuestionText" required rows="4" style="width:100%;padding:12px;border:1px solid #ccd5e0;border-radius:9px;font:inherit" placeholder="Tulis pertanyaan di sini"></textarea>
<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div><label class="field-label" for="manualOptionA">Pilihan A *</label><input id="manualOptionA" required></div><div><label class="field-label" for="manualOptionB">Pilihan B *</label><input id="manualOptionB" required></div><div><label class="field-label" for="manualOptionC">Pilihan C *</label><input id="manualOptionC" required></div><div><label class="field-label" for="manualOptionD">Pilihan D *</label><input id="manualOptionD" required></div><div><label class="field-label" for="manualOptionE">Pilihan E *</label><input id="manualOptionE" required></div></div>
<label class="field-label" for="manualCorrectAnswer">Kunci Jawaban *</label><select id="manualCorrectAnswer" required><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option></select>
<label class="field-label" for="manualPoints">Bobot Nilai</label><input id="manualPoints" type="number" min="0.01" step="any" value="1" required>
<div id="manualQuestionMessage" class="msg" role="status"></div><div class="toolbar"><button class="primary" id="saveManualQuestion" type="submit" style="width:auto;margin-top:0">Simpan Soal</button><button class="secondary" id="cancelManualQuestion" type="button">Batal</button></div></form></div>

function escapeHtml(value){return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getUserName(){return currentUser?.full_name || currentUser?.name || currentUser?.email || "Admin ASAS";}
function placeholder(line1,line2){return `<section class="panel"><h3>Informasi</h3><div class="empty-note">${escapeHtml(line1)}<br><br>${escapeHtml(line2)}</div></section>`;}

let cachedStudents=[];
function getAccessToken(){try{return JSON.parse(sessionStorage.getItem("asas_session")||"{}").access_token||"";}catch{return "";}}
async function loadStudents(){
 const area=document.getElementById("studentTableArea"),meta=document.getElementById("studentMeta");
 if(!area||!meta)return;
 const token=getAccessToken();
 if(!token){area.className="empty-note";area.textContent="Sesi login tidak ditemukan. Silakan keluar lalu masuk kembali.";meta.textContent="";return;}
 area.className="empty-note";area.textContent="Sedang mengambil data siswa dari Supabase...";meta.textContent="Memuat data...";
 try{
  const url=SUPABASE_URL+"/rest/v1/students?select=id,nis,nisn,full_name,gender,status,education_level,school_class,phone&order=full_name.asc";
  const response=await fetch(url,{headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token,"Accept":"application/json"}});
  const data=await response.json().catch(()=>[]);
  if(!response.ok){throw new Error(data.message||data.details||("HTTP "+response.status));}
  cachedStudents=Array.isArray(data)?data:[];drawStudentsTable();
 }catch(error){console.error("Gagal memuat siswa:",error);area.className="empty-note";area.textContent="Data siswa belum dapat dimuat. Pesan server: "+error.message;meta.textContent="Periksa kebijakan akses (RLS) tabel students untuk akun administrator.";}
}
function drawStudentsTable(){
 const area=document.getElementById("studentTableArea"),meta=document.getElementById("studentMeta"),search=document.getElementById("studentSearch");if(!area||!meta)return;
 const term=(search?.value||"").trim().toLowerCase();const rows=cachedStudents.filter(s=>[s.nis,s.nisn,s.full_name,s.education_level,s.school_class].some(v=>String(v||"").toLowerCase().includes(term)));
 meta.textContent=`Menampilkan ${rows.length} dari ${cachedStudents.length} siswa`;
 if(!rows.length){area.className="empty-note";area.textContent=cachedStudents.length?"Tidak ada siswa yang cocok dengan pencarian.":"Belum ada data siswa di database.";return;}
 area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>No.</th><th>NIS</th><th>NISN</th><th>Nama Lengkap</th><th>Program</th><th>Kelas</th><th>Status</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(s.nis||"—")}</td><td>${escapeHtml(s.nisn||"—")}</td><td><strong>${escapeHtml(s.full_name||"—")}</strong></td><td>${escapeHtml(s.education_level||"—")}</td><td>${escapeHtml(s.school_class||"—")}</td><td><span class="status ${String(s.status||"").toLowerCase()==="aktif"?"":"status-off"}">${escapeHtml(s.status||"—")}</span></td></tr>`).join("")}</tbody></table>`;
}
function setupStudentsPage(){const search=document.getElementById("studentSearch"),reload=document.getElementById("reloadStudents");if(search)search.addEventListener("input",drawStudentsTable);if(reload)reload.addEventListener("click",loadStudents);loadStudents();}

let cachedSubjects=[];
async function loadSubjects(){
 const area=document.getElementById("subjectTableArea"),meta=document.getElementById("subjectMeta");if(!area||!meta)return;
 const token=getAccessToken();if(!token){area.className="empty-note";area.textContent="Sesi login tidak ditemukan. Silakan keluar lalu masuk kembali.";meta.textContent="";return;}
 area.className="empty-note";area.textContent="Sedang mengambil data mata pelajaran dari Supabase...";meta.textContent="Memuat data...";
 try{
  const response=await fetch(SUPABASE_URL+"/rest/v1/subjects?select=*&order=name.asc",{headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token,"Accept":"application/json"}});
  const data=await response.json().catch(()=>[]);if(!response.ok)throw new Error(data.message||data.details||("HTTP "+response.status));
  cachedSubjects=Array.isArray(data)?data:[];drawSubjectsTable();
 }catch(error){console.error("Gagal memuat mata pelajaran:",error);area.className="empty-note";area.textContent="Mata pelajaran belum dapat dimuat. Pesan server: "+error.message;meta.textContent="Jika muncul 401/403, periksa kebijakan akses (RLS) tabel subjects untuk akun administrator.";}
}
function drawSubjectsTable(){
 const area=document.getElementById("subjectTableArea"),meta=document.getElementById("subjectMeta");if(!area||!meta)return;
 const search=(document.getElementById("subjectSearch")?.value||"").trim().toLowerCase();
 const program=document.getElementById("subjectProgram")?.value||"";const gradeValue=document.getElementById("subjectGrade")?.value||"";const grade=gradeValue?Number(gradeValue):null;
 const normalizeProgram=value=>{
  const v=String(value??"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(["A","PA","PAKETA","PAKETA1","SD"].includes(v)||v.includes("PAKETA"))return "A";
  if(["B","PB","PAKETB","SMP"].includes(v)||v.includes("PAKETB"))return "B";
  if(["C","PC","PAKETC","SMA"].includes(v)||v.includes("PAKETC"))return "C";
  return v;
 };
 const getProgram=r=>normalizeProgram(r.program_code??r.program??r.paket??r.education_level??r.level??"");
 const getMin=r=>Number(r.grade_min??r.grade_number??r.grade??r.grade_start??r.min_grade??0);
 const getMax=r=>Number(r.grade_max??r.grade_number??r.grade??r.grade_end??r.max_grade??getMin(r));
 const rows=cachedSubjects.filter(r=>{
  const matchesSearch=!search||Object.values(r).some(v=>String(v??"").toLowerCase().includes(search));
  const rp=getProgram(r);const matchesProgram=!program||rp===program;
  const min=getMin(r),max=getMax(r);const matchesGrade=!grade||(!min&&!max)||(grade>=min&&grade<=max);
  return matchesSearch&&matchesProgram&&matchesGrade;
 });
 meta.textContent=`Menampilkan ${rows.length} dari ${cachedSubjects.length} data mata pelajaran`;
 if(!rows.length){area.className="empty-note";area.textContent=cachedSubjects.length?"Tidak ada mata pelajaran yang cocok dengan filter.":"Tabel subjects berhasil dibaca, tetapi belum berisi data.";return;}
 const keys=Object.keys(rows[0]);const preferred=["name","subject_name","nama_mata_pelajaran","program_code","grade_min","grade_max","grade_number","grade","status"];
 const hidden=["id","created_at","updated_at"];const ordered=[...preferred.filter(k=>keys.includes(k)),...keys.filter(k=>!preferred.includes(k)&&!hidden.includes(k))];
 const labels={name:"Mata Pelajaran",subject_name:"Mata Pelajaran",nama_mata_pelajaran:"Mata Pelajaran",program_code:"Paket",grade_min:"Kelas Mulai",grade_max:"Kelas Akhir",grade_number:"Kelas",grade:"Kelas",status:"Status"};
 area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>No.</th>${ordered.map(k=>`<th>${escapeHtml(labels[k]||k.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${ordered.map(k=>`<td>${escapeHtml(r[k]===null||r[k]===""?"—":typeof r[k]==="object"?JSON.stringify(r[k]):r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function setupSubjectsPage(){const search=document.getElementById("subjectSearch"),program=document.getElementById("subjectProgram"),grade=document.getElementById("subjectGrade"),reload=document.getElementById("reloadSubjects");if(search)search.addEventListener("input",drawSubjectsTable);if(program)program.addEventListener("change",drawSubjectsTable);if(grade)grade.addEventListener("change",drawSubjectsTable);if(reload)reload.addEventListener("click",loadSubjects);loadSubjects();}

async function loadQuestionBankSubjects(){const select=document.getElementById("qbSubject");if(!select)return;select.innerHTML='<option value="">Memuat mata pelajaran...</option>';try{const token=getAccessToken();const response=await fetch(SUPABASE_URL+"/rest/v1/subjects?select=*&order=name.asc",{headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token,"Accept":"application/json"}});const data=await response.json().catch(()=>[]);if(!response.ok)throw new Error(data.message||("HTTP "+response.status));cachedQBSubjects=Array.isArray(data)?data:[];filterQBSubjects();}catch(e){select.innerHTML='<option value="">Gagal memuat mata pelajaran</option>';setQBMessage("Mata pelajaran gagal dimuat: "+e.message,"error");}}
function filterQBSubjects(){const select=document.getElementById("qbSubject"),program=document.getElementById("qbProgram"),grade=document.getElementById("qbGrade");if(!select||!program||!grade)return;const p=program.value.slice(-1),g=Number(grade.value);const rows=cachedQBSubjects.filter(r=>{const code=String(r.program_code??r.program??"").toUpperCase();const rp=code.includes("PAKET_A")||code==="A"?"A":code.includes("PAKET_B")||code==="B"?"B":code.includes("PAKET_C")||code==="C"?"C":"";const min=Number(r.grade_min??r.grade_number??r.grade??0),max=Number(r.grade_max??r.grade_number??r.grade??min);return rp===p&&(!min&&!max||(g>=min&&g<=max));});select.innerHTML=rows.length?rows.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.name??r.subject_name??r.code??"Mata Pelajaran")}</option>`).join(""):'<option value="">Tidak ada mata pelajaran untuk paket/kelas ini</option>';}
async function saveQuestionBank(event){event.preventDefault();const btn=document.getElementById("saveQuestionBank");const token=getAccessToken();if(!token){setQBMessage("Sesi login habis. Silakan keluar lalu masuk kembali.","error");return;}const program=document.getElementById("qbProgram").value;const grade=Number(document.getElementById("qbGrade").value);const subjectId=document.getElementById("qbSubject").value;if(!subjectId){setQBMessage("Pilih mata pelajaran yang tersedia.","error");return;}const payload={name:document.getElementById("qbName").value.trim(),program_code:program,grade_number:grade,subject_id:subjectId};btn.disabled=true;setQBMessage("Menyimpan bank soal...");try{const response=await fetch(SUPABASE_URL+"/rest/v1/question_banks?select=*",{method:"POST",headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept":"application/json","Prefer":"return=representation"},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||data.details||data.hint||("HTTP "+response.status));setQBMessage("Bank soal berhasil disimpan.","ok");document.getElementById("questionBankForm").reset();document.getElementById("qbProgram").value=program;document.getElementById("qbGrade").value=String(grade);filterQBSubjects();await loadQuestionBanks();}catch(e){console.error("Gagal menyimpan bank soal:",e);setQBMessage("Belum berhasil disimpan: "+e.message+". Data lain tidak diubah.","error");}finally{btn.disabled=false;}}


async function editQuestionBank(id){const bank=cachedQuestionBanks.find(x=>String(x.id)===String(id));if(!bank)return;const name=prompt("Nama bank soal:",bank.name??bank.title??bank.bank_name??"");if(name===null)return;if(!name.trim()){alert("Nama bank soal tidak boleh kosong.");return;}if(!confirm("Simpan perubahan nama bank soal ini?"))return;try{const res=await fetch(SUPABASE_URL+"/rest/v1/question_banks?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify({name:name.trim()})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.message||d.details||("HTTP "+res.status));await loadQuestionBanks();await fillQuestionBankPicker();questionMessage("Nama bank soal berhasil diperbarui.","ok");}catch(e){alert("Bank soal belum dapat diedit: "+e.message);}}

async function loadQuestionsForBank(){const bankId=document.getElementById("questionTargetBank")?.value,area=document.getElementById("questionListArea"),meta=document.getElementById("questionListMeta");if(!area||!meta)return;if(!bankId){area.className="empty-note";area.textContent="Buat bank soal terlebih dahulu.";meta.textContent="";return;}area.className="empty-note";area.textContent="Memuat butir soal...";try{const res=await fetch(SUPABASE_URL+"/rest/v1/questions?select=id,question_text,question_type,created_at&question_bank_id=eq."+encodeURIComponent(bankId)+"&order=created_at.asc",{headers:getRestHeaders()});const data=await res.json().catch(()=>[]);if(!res.ok)throw new Error(data.message||data.details||("HTTP "+res.status));cachedQuestions=data;meta.textContent="Jumlah soal: "+data.length;if(!data.length){area.className="empty-note";area.textContent="Belum ada butir soal pada bank ini.";return;}const optsRes=await fetch(SUPABASE_URL+"/rest/v1/question_options?select=question_id,option_label,option_text,is_correct&question_id=in.("+data.map(q=>q.id).join(",")+")",{headers:getRestHeaders()});const opts=optsRes.ok?await optsRes.json().catch(()=>[]):[];area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>No.</th><th>Pertanyaan</th><th>Pilihan</th><th>Aksi</th></tr></thead><tbody>${data.map((q,i)=>{const oo=opts.filter(o=>String(o.question_id)===String(q.id));return `<tr><td>${i+1}</td><td>${escapeHtml(q.question_text)}</td><td>${oo.map(o=>escapeHtml(o.option_label+". "+o.option_text)+(o.is_correct?" ✓":"")).join("<br>")||"Pilihan belum terbaca"}</td><td><button class="secondary" data-edit-question="${escapeHtml(q.id)}" type="button">Edit</button> <button class="secondary" data-delete-question="${escapeHtml(q.id)}" type="button">Hapus</button></td></tr>`}).join("")}</tbody></table>`;area.querySelectorAll("[data-edit-question]").forEach(b=>b.addEventListener("click",()=>editQuestion(b.dataset.editQuestion)));area.querySelectorAll("[data-delete-question]").forEach(b=>b.addEventListener("click",()=>deleteQuestion(b.dataset.deleteQuestion)));}catch(e){area.className="empty-note";area.textContent="Butir soal belum dapat dimuat: "+e.message;}}
let cachedQuestions=[];
async function editQuestion(id){const q=cachedQuestions.find(x=>String(x.id)===String(id));if(!q)return;const text=prompt("Ubah teks pertanyaan:",q.question_text||"");if(text===null)return;if(!text.trim()){alert("Pertanyaan tidak boleh kosong.");return;}try{const res=await fetch(SUPABASE_URL+"/rest/v1/questions?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify({question_text:text.trim()})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.message||d.details||("HTTP "+res.status));await loadQuestionsForBank();questionMessage("Pertanyaan berhasil diperbarui. Pilihan jawaban tidak diubah.","ok");}catch(e){alert("Pertanyaan belum dapat diedit: "+e.message);}}
async function deleteQuestion(id){const q=cachedQuestions.find(x=>String(x.id)===String(id));if(!q)return;if(!confirm("Hapus butir soal ini beserta pilihan jawabannya? Jika sudah digunakan pada ujian, database mungkin menolak penghapusan."))return;try{const check=await fetch(SUPABASE_URL+"/rest/v1/exam_questions?select=id&question_id=eq."+encodeURIComponent(id)+"&limit=1",{headers:getRestHeaders()});if(check.ok){const refs=await check.json().catch(()=>[]);if(refs.length){alert("Soal tidak dihapus karena sudah terhubung dengan ujian. Demi menjaga riwayat ujian, soal ini dipertahankan.");return;}}const ores=await fetch(SUPABASE_URL+"/rest/v1/question_options?question_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:getRestHeaders({"Prefer":"return=minimal"})});if(!ores.ok)throw new Error("Pilihan jawaban gagal dihapus; soal dipertahankan.");const res=await fetch(SUPABASE_URL+"/rest/v1/questions?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:getRestHeaders({"Prefer":"return=minimal"})});const d=await res.json().catch(()=>({}));if(!res.ok)throw new Error(d.message||d.details||("HTTP "+res.status));await loadQuestionsForBank();questionMessage("Butir soal berhasil dihapus.","ok");}catch(e){alert("Soal belum dapat dihapus: "+e.message);}}

function setupQuestionEntry(){

async function insertQuestionWithOptions(row){
 const bankId=document.getElementById("questionTargetBank")?.value;if(!bankId)throw new Error("Pilih bank soal terlebih dahulu.");
 const points=Number(String(row.points??"1").replace(",","."));if(!Number.isFinite(points)||points<=0)throw new Error("Bobot Nilai harus berupa angka lebih dari 0.");
 const questionPayload={question_bank_id:bankId,question_text:row.question,question_type:"pilihan_ganda",points};
 const qResponse=await fetch(SUPABASE_URL+"/rest/v1/questions?select=*",{method:"POST",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=representation"}),body:JSON.stringify(questionPayload)});
 const qData=await qResponse.json().catch(()=>({}));if(!qResponse.ok)throw new Error(qData.message||qData.details||qData.hint||"Gagal menyimpan soal (HTTP "+qResponse.status+").");
 const q=Array.isArray(qData)?qData[0]:qData;if(!q?.id)throw new Error("Soal tersimpan tetapi ID soal tidak diterima.");
 const opts=["A","B","C","D","E"].map((label,i)=>({question_id:q.id,option_label:label,option_text:row[label],is_correct:label===row.key}));
 const oResponse=await fetch(SUPABASE_URL+"/rest/v1/question_options",{method:"POST",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify(opts)});
 const oData=await oResponse.json().catch(()=>({}));if(!oResponse.ok)throw new Error("Soal sudah tersimpan, tetapi pilihan jawaban gagal disimpan: "+(oData.message||oData.details||oData.hint||("HTTP "+oResponse.status))+". Catat soal ini untuk diperiksa sebelum mencoba ulang.");
}
async function saveManualQuestion(event){event.preventDefault();const btn=document.getElementById("saveManualQuestion");const row={question:document.getElementById("manualQuestionText").value.trim(),A:document.getElementById("manualOptionA").value.trim(),B:document.getElementById("manualOptionB").value.trim(),C:document.getElementById("manualOptionC").value.trim(),D:document.getElementById("manualOptionD").value.trim(),E:document.getElementById("manualOptionE").value.trim(),key:document.getElementById("manualCorrectAnswer").value,points:document.getElementById("manualPoints").value};if(!row.question||![row.A,row.B,row.C,row.D,row.E].every(Boolean)){manualMessage("Pertanyaan dan semua pilihan A–E wajib diisi.","error");return;}if(!document.getElementById("questionTargetBank").value){manualMessage("Pilih atau buat bank soal terlebih dahulu.","error");return;}btn.disabled=true;manualMessage("Menyimpan soal...");try{await insertQuestionWithOptions(row);manualMessage("Soal dan pilihan jawaban berhasil disimpan.","ok");formResetManual();}catch(e){manualMessage("Gagal menyimpan: "+e.message,"error");}finally{btn.disabled=false;}}
function formResetManual(){document.getElementById("manualQuestionForm")?.reset();if(document.getElementById("manualPoints"))document.getElementById("manualPoints").value="1";}
function normalizeImportRow(r){const get=(...keys)=>{for(const k of keys){const found=Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());if(found!==undefined&&r[found]!==null)return String(r[found]).trim();}return "";};return {no:get("No","Nomor"),question:get("Pertanyaan","Soal","Question"),A:get("A","Pilihan A"),B:get("B","Pilihan B"),C:get("C","Pilihan C"),D:get("D","Pilihan D"),E:get("E","Pilihan E"),key:get("Kunci","Kunci Jawaban","Jawaban").toUpperCase(),points:get("Bobot","Poin","Points")||"1"};}
async function previewQuestionImport(){const file=document.getElementById("questionImportFile")?.files?.[0],area=document.getElementById("questionImportPreview"),meta=document.getElementById("questionImportMeta"),save=document.getElementById("saveQuestionImport");if(!file){meta.textContent="Pilih file Excel atau CSV terlebih dahulu.";return;}if(!document.getElementById("questionTargetBank").value){meta.textContent="Pilih bank soal terlebih dahulu.";return;}try{let raw=[];const ext=file.name.split(".").pop().toLowerCase();if(ext==="csv"){const text=await file.text();raw=parseCSV(text);}else{if(!window.XLSX)throw new Error("Pembaca Excel belum termuat. Coba gunakan file CSV.");const buf=await file.arrayBuffer();const workbook=XLSX.read(buf,{type:"array"});raw=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{defval:""});}pendingImportedQuestions=raw.map(normalizeImportRow).filter(r=>r.question);const invalid=pendingImportedQuestions.filter(r=>!r.A||!r.B||!r.C||!r.D||!r.E||!["A","B","C","D","E"].includes(r.key));meta.textContent=`Ditemukan ${pendingImportedQuestions.length} soal; ${invalid.length} baris perlu diperbaiki.`;if(!pendingImportedQuestions.length)throw new Error("Tidak ditemukan baris soal. Pastikan judul kolom sesuai template.");area.className=invalid.length?"empty-note":"table-wrap";area.innerHTML=`<table><thead><tr><th>No</th><th>Pertanyaan</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>Kunci</th><th>Bobot</th><th>Status</th></tr></thead><tbody>${pendingImportedQuestions.slice(0,100).map((r,i)=>{const bad=!r.A||!r.B||!r.C||!r.D||!r.E||!["A","B","C","D","E"].includes(r.key);return `<tr><td>${escapeHtml(r.no||i+1)}</td><td>${escapeHtml(r.question)}</td><td>${escapeHtml(r.A)}</td><td>${escapeHtml(r.B)}</td><td>${escapeHtml(r.C)}</td><td>${escapeHtml(r.D)}</td><td>${escapeHtml(r.E)}</td><td>${escapeHtml(r.key)}</td><td>${escapeHtml(r.points)}</td><td>${bad?"Periksa":"Siap"}</td></tr>`}).join("")}</tbody></table>${pendingImportedQuestions.length>100?`<p class="table-meta">Pratinjau dibatasi 100 baris; semua ${pendingImportedQuestions.length} soal akan diproses.</p>`:""}`;save.disabled=invalid.length>0;questionMessage(invalid.length?"Perbaiki baris yang belum lengkap atau kunci yang bukan A/B/C/D/E.":"File lolos pemeriksaan awal. Klik Simpan Semua Soal untuk menyimpan.",invalid.length?"error":"ok");}catch(e){pendingImportedQuestions=[];save.disabled=true;area.className="empty-note";area.textContent=e.message;meta.textContent="File belum siap diimpor.";}}
function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++;}else if(c==='"'){quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field="";}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);row=[];field="";}else field+=c;}row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);if(rows.length<2)return [];const headers=rows[0].map(h=>String(h).trim().replace(/^\uFEFF/,''));return rows.slice(1).map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]??""])));}
async function saveImportedQuestions(){const btn=document.getElementById("saveQuestionImport");if(!pendingImportedQuestions.length)return;btn.disabled=true;let done=0;for(const row of pendingImportedQuestions){try{await insertQuestionWithOptions(row);done++;document.getElementById("questionImportMeta").textContent=`Menyimpan soal ${done} dari ${pendingImportedQuestions.length}...`;}catch(e){questionMessage(`Berhasil menyimpan ${done} dari ${pendingImportedQuestions.length} soal. Berhenti pada soal nomor ${row.no||done+1}: ${e.message}`,"error");btn.disabled=false;return;}}questionMessage(`Berhasil menyimpan ${done} soal ke bank soal yang dipilih.`,"ok");document.getElementById("questionImportMeta").textContent=`Selesai: ${done} soal disimpan.`;document.getElementById("questionImportPreview").className="empty-note";document.getElementById("questionImportPreview").textContent="Impor selesai.";pendingImportedQuestions=[];btn.disabled=true;}
function downloadQuestionTemplate(){const csv='No,Pertanyaan,A,B,C,D,E,Kunci,Bobot\n1,"Ibu kota Indonesia adalah …",Bandung,Jakarta,Surabaya,Medan,Jakarta,B,1\n2,"2 + 3 = …",4,5,6,7,8,B,0.5\n';const blob=new Blob(['\uFEFF',csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Template_Impor_Soal_ASAS.csv";a.click();URL.revokeObjectURL(url);}

async function apiRequest(path, options={}){const response=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:getRestHeaders({"Content-Type":"application/json",...(options.headers||{})})});const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null;}catch{data=raw;}if(!response.ok)throw new Error(data?.message||data?.details||data?.hint||String(data||("HTTP "+response.status)));return data;}
function isoFromLocal(v){return v?new Date(v).toISOString():null;}
function localFromIso(v){if(!v)return "";const d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function programLabel(v){return ({PAKET_A:"Paket A",PAKET_B:"Paket B",PAKET_C:"Paket C",A:"Paket A",B:"Paket B",C:"Paket C"})[v]||v||"—";}

function populateExamGrades(){const el=document.getElementById("examGrade");if(!el)return;const p=document.getElementById("examProgram").value,max=p==="PAKET_A"?6:p==="PAKET_B"?9:12,min=p==="PAKET_A"?1:p==="PAKET_B"?7:10;el.innerHTML=Array.from({length:max-min+1},(_,i)=>`<option value="${min+i}">Kelas ${min+i}</option>`).join("");populateExamSubjects();populateExamBanks();}
function populateExamBanks(){const el=document.getElementById("examBank");if(!el)return;const subj=document.getElementById("examSubject").value,prog=document.getElementById("examProgram").value,grade=Number(document.getElementById("examGrade").value);const list=cachedExamBanks.filter(b=>b.subject_id===subj&&b.grade_number===grade&&(b.program_code===prog||b.program_code===prog.replace("PAKET_","")));el.innerHTML='<option value="">Pilih bank soal</option>'+list.map(b=>`<option value="${b.id}">${escapeHtml(b.name)}</option>`).join("");renderExamQuestionPicker();}
async function renderExamQuestionPicker(){const area=document.getElementById("examQuestionPicker"),bank=document.getElementById("examBank")?.value;if(!area)return;if(!bank){area.className="empty-note";area.textContent="Pilih bank soal untuk memuat soal.";cachedExamQuestions=[];return;}area.className="empty-note";area.textContent="Memuat soal dari bank...";try{cachedExamQuestions=await apiRequest("questions?select=id,question_text,question_type,points,default_points,is_active&question_bank_id=eq."+encodeURIComponent(bank)+"&is_active=eq.true&order=created_at.asc");if(!cachedExamQuestions.length){area.textContent="Bank soal ini belum memiliki soal aktif.";return;}area.className="";area.innerHTML=`<div class="toolbar"><button id="selectAllExamQuestions" class="secondary" type="button">Pilih semua</button><span class="table-meta">${cachedExamQuestions.length} soal tersedia</span></div>`+cachedExamQuestions.map((q,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:10px;border-bottom:1px solid var(--line)"><input type="checkbox" class="exam-question-check" value="${q.id}" checked style="width:auto;margin-top:3px"><span>${i+1}. ${escapeHtml(q.question_text)} <small>(${escapeHtml(q.question_type)} · ${escapeHtml(q.points??q.default_points??1)} poin)</small></span></label>`).join("");document.getElementById("selectAllExamQuestions")?.addEventListener("click",()=>area.querySelectorAll(".exam-question-check").forEach(c=>c.checked=true));}catch(e){area.className="empty-note";area.textContent="Soal gagal dimuat: "+e.message;}}
async function loadExams(){const area=document.getElementById("examTableArea"),meta=document.getElementById("examMeta");if(!area)return;area.className="empty-note";area.textContent="Memuat daftar ujian...";try{cachedExams=await apiRequest("exams?select=*&order=created_at.desc");meta.textContent="Jumlah ujian: "+cachedExams.length;if(!cachedExams.length){area.textContent="Belum ada ujian. Klik + Buat Ujian untuk memulai.";return;}const subjects=await apiRequest("subjects?select=id,name");area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Nama Ujian</th><th>Mata Pelajaran</th><th>Paket/Kelas</th><th>Durasi</th><th>Mulai</th><th>Selesai</th><th>Status</th></tr></thead><tbody>${cachedExams.map(e=>`<tr><td><strong>${escapeHtml(e.title)}</strong></td><td>${escapeHtml(subjects.find(s=>s.id===e.subject_id)?.name||"—")}</td><td>${escapeHtml(programLabel(e.program_code))} / ${escapeHtml(e.grade_number)}</td><td>${e.duration_minutes} menit</td><td>${escapeHtml(e.scheduled_start?new Date(e.scheduled_start).toLocaleString("id-ID"):"Belum diatur")}</td><td>${escapeHtml(e.scheduled_end?new Date(e.scheduled_end).toLocaleString("id-ID"):"Belum diatur")}</td><td><span class="status ${e.status==="draft"?"status-off":""}">${escapeHtml(e.status||"draft")}</span></td></tr>`).join("")}</tbody></table>`;populateResultExamFilter();}catch(e){area.className="empty-note";area.textContent="Gagal memuat ujian: "+e.message;meta.textContent="Periksa akses RLS tabel exams.";}}
async function saveExam(event){event.preventDefault();const msg=document.getElementById("examFormMessage");const selected=[...document.querySelectorAll(".exam-question-check:checked")].map(x=>x.value);if(!selected.length){msg.className="msg error";msg.textContent="Pilih minimal satu soal.";return;}const start=document.getElementById("examStart").value,end=document.getElementById("examEnd").value;if(start&&end&&new Date(end)<=new Date(start)){msg.className="msg error";msg.textContent="Waktu selesai harus setelah waktu mulai.";return;}const btn=document.querySelector('#examForm button[type="submit"]');btn.disabled=true;msg.className="msg";msg.textContent="Menyimpan ujian dan menyalin soal...";let exam=null;try{const payload={title:document.getElementById("examTitle").value.trim(),subject_id:document.getElementById("examSubject").value,academic_year_id:document.getElementById("examYear").value,program_code:document.getElementById("examProgram").value,grade_number:Number(document.getElementById("examGrade").value),duration_minutes:Number(document.getElementById("examDuration").value),scheduled_start:isoFromLocal(start),scheduled_end:isoFromLocal(end),status:"draft",shuffle_questions:document.getElementById("examShuffleQ").checked,shuffle_options:document.getElementById("examShuffleO").checked};const created=await apiRequest("exams?select=*",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});exam=Array.isArray(created)?created[0]:created;if(!exam?.id)throw new Error("Ujian tersimpan tanpa ID yang dapat dibaca.");const classFilter=`classes?select=id&program_code=eq.${encodeURIComponent(payload.program_code)}&grade_number=eq.${payload.grade_number}`;const classes=await apiRequest(classFilter);if(classes.length){await apiRequest("exam_classes",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(classes.map(c=>({exam_id:exam.id,class_id:c.id})))});}const originals=await apiRequest("questions?select=id,question_type,question_text,points,default_points& id=in.("+selected.join(",")+")".replace("& ","&"));for(let i=0;i<originals.length;i++){const q=originals[i];const newQ=await apiRequest("exam_questions?select=id",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({exam_id:exam.id,source_question_id:q.id,question_type:q.question_type,question_text:q.question_text,points:Number(q.points??q.default_points??1),display_order:i+1})});const eq=Array.isArray(newQ)?newQ[0]:newQ;const opts=await apiRequest("question_options?select=option_label,option_text,is_correct,display_order&question_id=eq."+q.id);if(opts.length)await apiRequest("exam_question_options",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(opts.map(o=>({exam_question_id:eq.id,option_label:o.option_label,option_text:o.option_text,is_correct:o.is_correct,display_order:o.display_order})))});}msg.className="msg ok";msg.textContent=`Ujian berhasil dibuat dengan ${originals.length} soal. Status awal: draft.`;document.getElementById("examForm").reset();document.getElementById("examFormWrap").classList.add("hidden");await loadExams();}catch(e){msg.className="msg error";msg.textContent="Gagal menyimpan ujian: "+e.message+(exam?". Catatan: data ujian mungkin sudah terbentuk sebagian; periksa daftar ujian sebelum mencoba ulang.":"");}finally{btn.disabled=false;}}
async function setupExamsPage(){try{await loadExamLookups();populateExamYears();populateExamGrades();}catch(e){const area=document.getElementById("examTableArea");if(area)area.textContent="Data pilihan ujian gagal dimuat: "+e.message;}document.getElementById("toggleExamForm")?.addEventListener("click",()=>document.getElementById("examFormWrap").classList.toggle("hidden"));document.getElementById("cancelExamForm")?.addEventListener("click",()=>document.getElementById("examFormWrap").classList.add("hidden"));document.getElementById("examProgram")?.addEventListener("change",populateExamGrades);document.getElementById("examGrade")?.addEventListener("change",()=>{populateExamSubjects();populateExamBanks();});document.getElementById("examSubject")?.addEventListener("change",populateExamBanks);document.getElementById("examBank")?.addEventListener("change",renderExamQuestionPicker);document.getElementById("examForm")?.addEventListener("submit",saveExam);document.getElementById("reloadExams")?.addEventListener("click",loadExams);await loadExams();}
async function setupSchedulesPage(){const wrap=document.getElementById("scheduleFormWrap");document.getElementById("addSchedule")?.addEventListener("click",async()=>{try{cachedExams=await apiRequest("exams?select=id,title,scheduled_start,scheduled_end&order=created_at.desc");document.getElementById("scheduleExam").innerHTML=cachedExams.map(e=>`<option value="${e.id}">${escapeHtml(e.title)}</option>`).join("");wrap.classList.toggle("hidden");}catch(e){document.getElementById("scheduleMessage").textContent="Gagal memuat ujian: "+e.message;}});document.getElementById("cancelSchedule")?.addEventListener("click",()=>wrap.classList.add("hidden"));document.getElementById("scheduleExam")?.addEventListener("change",()=>{const e=cachedExams.find(x=>x.id===document.getElementById("scheduleExam").value);document.getElementById("scheduleStart").value=localFromIso(e?.scheduled_start);document.getElementById("scheduleEnd").value=localFromIso(e?.scheduled_end);});document.getElementById("saveSchedule")?.addEventListener("click",async()=>{const id=document.getElementById("scheduleExam").value,start=document.getElementById("scheduleStart").value,end=document.getElementById("scheduleEnd").value,msg=document.getElementById("scheduleMessage");if(!id||!start||!end){msg.className="msg error";msg.textContent="Pilih ujian dan lengkapi kedua waktu.";return;}if(new Date(end)<=new Date(start)){msg.className="msg error";msg.textContent="Waktu selesai harus setelah waktu mulai.";return;}try{await apiRequest("exams?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({scheduled_start:isoFromLocal(start),scheduled_end:isoFromLocal(end)})});msg.className="msg ok";msg.textContent="Jadwal berhasil disimpan.";await loadSchedules();}catch(e){msg.className="msg error";msg.textContent="Gagal menyimpan jadwal: "+e.message;}});document.getElementById("reloadSchedules")?.addEventListener("click",loadSchedules);await loadSchedules();}
async function loadSchedules(){const area=document.getElementById("scheduleTableArea"),meta=document.getElementById("scheduleMeta");if(!area)return;try{cachedExams=await apiRequest("exams?select=id,title,program_code,grade_number,scheduled_start,scheduled_end,status&order=scheduled_start.asc.nullslast");meta.textContent="Jumlah ujian terjadwal: "+cachedExams.filter(e=>e.scheduled_start||e.scheduled_end).length;const rows=cachedExams.filter(e=>e.scheduled_start||e.scheduled_end);if(!rows.length){area.className="empty-note";area.textContent="Belum ada jadwal. Klik + Tambah Jadwal atau atur jadwal saat membuat ujian.";return;}area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Ujian</th><th>Kelas</th><th>Mulai</th><th>Selesai</th><th>Aksi</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${escapeHtml(e.title)}</td><td>${escapeHtml(programLabel(e.program_code))} ${e.grade_number}</td><td>${escapeHtml(e.scheduled_start?new Date(e.scheduled_start).toLocaleString("id-ID"):"—")}</td><td>${escapeHtml(e.scheduled_end?new Date(e.scheduled_end).toLocaleString("id-ID"):"—")}</td><td><button class="secondary" data-edit-schedule="${e.id}" type="button">Ubah</button></td></tr>`).join("")}</tbody></table>`;area.querySelectorAll("[data-edit-schedule]").forEach(b=>b.addEventListener("click",()=>{const e=cachedExams.find(x=>x.id===b.dataset.editSchedule);document.getElementById("scheduleFormWrap").classList.remove("hidden");document.getElementById("scheduleExam").value=e.id;document.getElementById("scheduleStart").value=localFromIso(e.scheduled_start);document.getElementById("scheduleEnd").value=localFromIso(e.scheduled_end);}));}catch(e){area.className="empty-note";area.textContent="Gagal memuat jadwal: "+e.message;}}
function populateResultExamFilter(){const el=document.getElementById("resultExamFilter");if(el)el.innerHTML='<option value="">Semua ujian</option>'+cachedExams.map(e=>`<option value="${e.id}">${escapeHtml(e.title)}</option>`).join("");}
async function setupResultsPage(){document.getElementById("reloadResults")?.addEventListener("click",loadResults);document.getElementById("resultExamFilter")?.addEventListener("change",loadResults);document.getElementById("exportResults")?.addEventListener("click",exportResultsCsv);try{cachedExams=await apiRequest("exams?select=id,title&order=created_at.desc");populateResultExamFilter();}catch{}await loadResults();}
async function loadResults(){const area=document.getElementById("resultTableArea"),meta=document.getElementById("resultMeta");if(!area)return;try{const filter=document.getElementById("resultExamFilter")?.value;cachedResults=await apiRequest("exam_results?select=id,attempt_id,student_id,exam_id,objective_score,essay_score,total_score,max_score,is_final,finalized_at,created_at&"+(filter?"exam_id=eq."+encodeURIComponent(filter)+"&":"")+"order=created_at.desc");const [students,exams,attempts]=await Promise.all([apiRequest("students?select=id,nis,full_name"),apiRequest("exams?select=id,title"),apiRequest("exam_attempts?select=id,status,started_at,submitted_at")]);meta.textContent="Jumlah hasil tersimpan: "+cachedResults.length;if(!cachedResults.length){area.className="empty-note";area.textContent="Belum ada nilai tersimpan. Nilai akan muncul setelah siswa menyelesaikan ujian dan hasilnya tercatat.";return;}area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Siswa</th><th>NIS</th><th>Ujian</th><th>Nilai Objektif</th><th>Nilai Esai</th><th>Nilai Total</th><th>Status</th></tr></thead><tbody>${cachedResults.map(r=>{const st=students.find(s=>s.id===r.student_id),ex=exams.find(e=>e.id===r.exam_id),at=attempts.find(a=>a.id===r.attempt_id);return `<tr><td>${escapeHtml(st?.full_name||r.student_id)}</td><td>${escapeHtml(st?.nis||"—")}</td><td>${escapeHtml(ex?.title||"—")}</td><td>${escapeHtml(r.objective_score??0)}</td><td>${escapeHtml(r.essay_score??0)}</td><td><strong>${escapeHtml(r.total_score??"Belum final")}</strong></td><td>${r.is_final?"Final":"Belum final"}${at?.status?" · "+escapeHtml(at.status):""}</td></tr>`}).join("")}</tbody></table>`;}catch(e){area.className="empty-note";area.textContent="Gagal memuat nilai: "+e.message;meta.textContent="Periksa RLS tabel exam_results, students, exams, dan exam_attempts.";}}
function exportResultsCsv(){if(!cachedResults.length){alert("Tidak ada hasil nilai untuk diekspor.");return;}const csv=[['Siswa ID','Ujian ID','Nilai Objektif','Nilai Esai','Nilai Total','Nilai Maksimum','Final'].join(','),...cachedResults.map(r=>[r.student_id,r.exam_id,r.objective_score,r.essay_score,r.total_score,r.max_score,r.is_final].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))].join('\r\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Rekap_Nilai_ASAS.csv';a.click();URL.revokeObjectURL(url);}
async function setupSettingsPage(){document.getElementById("settingName").value=currentUser?.full_name||currentUser?.name||"Administrator ASAS";document.getElementById("profileForm")?.addEventListener("submit",e=>{e.preventDefault();const name=document.getElementById("settingName").value.trim();if(!name)return;currentUser={...(currentUser||{}),full_name:name};sessionStorage.setItem("asas_user",JSON.stringify(currentUser));document.getElementById("topUser").textContent=name;document.getElementById("profileMessage").className="msg ok";document.getElementById("profileMessage").textContent="Nama tampilan disimpan pada browser ini.";});document.getElementById("reloadYears")?.addEventListener("click",loadYears);await loadYears();}
async function loadYears(){const area=document.getElementById("yearTableArea");if(!area)return;try{const years=await apiRequest("academic_years?select=*&order=start_date.desc.nullslast,name.desc");if(!years.length){area.className="empty-note";area.textContent="Belum ada data tahun ajaran.";return;}area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Tahun Ajaran</th><th>Semester</th><th>Mulai</th><th>Selesai</th><th>Status</th></tr></thead><tbody>${years.map(y=>`<tr><td>${escapeHtml(y.name)}</td><td>${escapeHtml(y.semester)}</td><td>${escapeHtml(y.start_date||"—")}</td><td>${escapeHtml(y.end_date||"—")}</td><td>${y.is_active?'<span class="status">Aktif</span>':'Nonaktif'}</td></tr>`).join("")}</tbody></table>`;}catch(e){area.className="empty-note";area.textContent="Gagal memuat tahun ajaran: "+e.message;}}

async function setupStudentExamsPage(){document.getElementById("reloadStudentExams")?.addEventListener("click",loadStudentExams);await loadStudentExams();}
async function loadStudentExams(){const area=document.getElementById("studentExamArea"),meta=document.getElementById("studentExamMeta");if(!area)return;area.className="empty-note";area.textContent="Memuat jadwal ujian...";try{let studentId=currentUser?.student_id||currentUser?.student?.id||null;const authUserId=currentUser?.auth_user_id||currentUser?.user_id||currentUser?.id||null;/* Hasil login kadang mengembalikan ID akun Auth pada id, bukan ID baris students. Cari ID siswa melalui auth_user_id terlebih dahulu. */if(authUserId){try{const matched=await apiRequest("students?select=id&auth_user_id=eq."+encodeURIComponent(authUserId)+"&limit=1");if(Array.isArray(matched)&&matched.length)studentId=matched[0].id;}catch(lookupError){console.warn("Pencarian siswa berdasarkan auth_user_id gagal; mencoba ID dari hasil login.",lookupError);}}if(!studentId&&currentUser?.id){try{const matchedById=await apiRequest("students?select=id&id=eq."+encodeURIComponent(currentUser.id)+"&limit=1");if(Array.isArray(matchedById)&&matchedById.length)studentId=matchedById[0].id;}catch(lookupError){console.warn("Pencarian siswa berdasarkan id gagal.",lookupError);}}if(!studentId){throw new Error("ID baris siswa belum ditemukan. Fungsi student-login perlu mengembalikan student_id atau auth_user_id yang sesuai.");}const enrollments=await apiRequest("student_enrollments?select=class_id,academic_year_id&student_id=eq."+encodeURIComponent(studentId));if(!enrollments.length){meta.textContent="Kelas siswa belum ditemukan";area.textContent="Akun ini belum memiliki penempatan kelas pada tahun ajaran. Hubungi administrator PKBM.";return;}const classIds=[...new Set(enrollments.map(x=>x.class_id).filter(Boolean))];const links=await apiRequest("exam_classes?select=exam_id,class_id&class_id=in.("+classIds.map(encodeURIComponent).join(",")+")");const examIds=[...new Set(links.map(x=>x.exam_id).filter(Boolean))];if(!examIds.length){meta.textContent="Jumlah ujian tersedia: 0";area.textContent="Belum ada ujian yang ditetapkan untuk kelasmu.";return;}const exams=await apiRequest("exams?select=id,title,program_code,grade_number,duration_minutes,scheduled_start,scheduled_end,status&id=in.("+examIds.map(encodeURIComponent).join(",")+")");const now=Date.now();const visible=exams.filter(e=>e.scheduled_start||e.scheduled_end);meta.textContent="Jumlah ujian terjadwal: "+visible.length;if(!visible.length){area.className="empty-note";area.textContent="Belum ada jadwal ujian untuk kelasmu.";return;}area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>Ujian</th><th>Kelas</th><th>Durasi</th><th>Mulai</th><th>Selesai</th><th>Status</th></tr></thead><tbody>${visible.map(e=>{const start=e.scheduled_start?new Date(e.scheduled_start):null,end=e.scheduled_end?new Date(e.scheduled_end):null;let status="Menunggu jadwal";if(e.status==="draft")status="Belum dibuka";else if(start&&end&&now>=start.getTime()&&now<=end.getTime())status="Sedang berlangsung";else if(start&&now<start.getTime())status="Belum mulai";else if(end&&now>end.getTime())status="Waktu berakhir";return `<tr><td>${escapeHtml(e.title)}</td><td>${escapeHtml(programLabel(e.program_code)+" "+e.grade_number)}</td><td>${escapeHtml(e.duration_minutes)} menit</td><td>${escapeHtml(start?start.toLocaleString("id-ID"):"—")}</td><td>${escapeHtml(end?end.toLocaleString("id-ID"):"—")}</td><td>${escapeHtml(status)}</td></tr>`}).join("")}</tbody></table><p class="hint" style="text-align:left">Daftar ini baru menampilkan jadwal. Tombol mulai dan penyimpanan jawaban akan diaktifkan setelah alur pengerjaan ujian serta kebijakan akses Supabase diuji.</p>`;}catch(e){meta.textContent="Jadwal belum dapat dimuat";area.className="empty-note";area.textContent="Tidak dapat memuat ujian: "+e.message+". Periksa kebijakan akses (RLS) tabel student_enrollments, exam_classes, dan exams.";}}

function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appScreen").classList.remove("hidden");document.getElementById("rolePill").textContent=currentRole==="admin"?"Administrator":"Siswa";document.getElementById("topUser").textContent=getUserName();const sidebar=document.getElementById("sidebar");sidebar.querySelectorAll("[data-page]").forEach(btn=>{const key=btn.dataset.page;btn.classList.toggle("hidden",currentRole==="admin"?key==="studentExams":!(key==="dashboard"||key==="studentExams"));});renderPage("dashboard");}
document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>renderPage(btn.dataset.page)));
document.getElementById("logoutButton").addEventListener("click",function(){sessionStorage.removeItem("asas_session");sessionStorage.removeItem("asas_role");sessionStorage.removeItem("asas_user");currentUser=null;currentRole=null;document.getElementById("appScreen").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");form.reset();role.dispatchEvent(new Event("change"));setMessage("Anda telah keluar dari sistem.","ok");});
role.dispatchEvent(new Event("change"));

// Pulihkan sesi yang tersimpan ketika halaman di-refresh.
(function restoreSession() {
  try {
    const savedSession = sessionStorage.getItem("asas_session");
    const savedRole = sessionStorage.getItem("asas_role");
    const savedUser = sessionStorage.getItem("asas_user");
    if (!savedSession || !savedRole) return;

    const parsedSession = JSON.parse(savedSession);
    if (!parsedSession || !parsedSession.access_token) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    // Jika waktu kedaluwarsa tersedia dan sudah lewat, minta login kembali.
    const expiresAt = parsedSession.expires_at;
    if (expiresAt && Date.now() >= Number(expiresAt) * 1000) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    currentRole = savedRole;
    currentUser = savedUser ? JSON.parse(savedUser) : {};
    showApp();
  } catch (error) {
    console.error("Tidak dapat memulihkan sesi ASAS:", error);
    sessionStorage.removeItem("asas_session");
    sessionStorage.removeItem("asas_role");
    sessionStorage.removeItem("asas_user");
  }
})();
</script>
