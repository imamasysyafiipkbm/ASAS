
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASAS - Sistem Ujian</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 { margin: 0 0 8px; text-align: center; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .secondary { background: #475569; }
    .message { margin-top: 16px; font-size: 14px; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
    .info { background: #f8fafc; padding: 15px; border-radius: 8px; line-height: 1.8; }
  </style>
</head>
<body>
  <main class="card">
    <section id="loginPanel">
      <h1>ASAS</h1>
      <p class="subtitle">Sistem Ujian Berbasis Web</p>

      <form id="loginForm">
        <label for="role">Jenis Login</label>
        <select id="role" required>
          <option value="siswa">Siswa</option>
          <option value="admin">Administrator</option>
        </select>

        <label for="identifier" id="identifierLabel">NIS atau NISN</label>
        <input
          id="identifier"
          type="text"
          autocomplete="username"
          placeholder="Masukkan NIS atau NISN"
          required
        >

        <label for="password">Kata Sandi</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Masukkan kata sandi"
          required
        >

        <button id="submitButton" type="submit">Masuk</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="dashboard" class="hidden">
      <h1>ASAS</h1>
      <p class="subtitle">Login berhasil</p>
      <div id="studentInfo" class="info"></div>
      <button id="logoutButton" class="secondary" type="button">Keluar</button>
    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://mllgkysdhobmbvudpehx.supabase.co";

    // Masukkan Publishable key yang sebelumnya sudah digunakan website.
    const SUPABASE_PUBLISHABLE_KEY = "GANTI_DENGAN_PUBLISHABLE_KEY_ANDA";

    const loginForm = document.getElementById("loginForm");
    const roleSelect = document.getElementById("role");
    const identifierInput = document.getElementById("identifier");
    const passwordInput = document.getElementById("password");
    const identifierLabel = document.getElementById("identifierLabel");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const loginPanel = document.getElementById("loginPanel");
    const dashboard = document.getElementById("dashboard");
    const studentInfo = document.getElementById("studentInfo");


roleSelect.addEventListener("change", function () {
  const isAdmin = roleSelect.value === "admin";

  identifierLabel.textContent = isAdmin
    ? "Email Administrator"
    : "NIS atau NISN";

  identifierInput.placeholder = isAdmin
    ? "Masukkan email administrator"
    : "Masukkan NIS atau NISN";

  identifierInput.value = "";
  passwordInput.value = "";
  message.textContent = "";
});

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      // Ambil nilai formulir SEBELUM memilih jenis login.
      const identifier = identifierInput.value.trim();
      const password = passwordInput.value;
      const role = roleSelect.value;

      if (
        !SUPABASE_PUBLISHABLE_KEY ||
        SUPABASE_PUBLISHABLE_KEY === "GANTI_DENGAN_PUBLISHABLE_KEY_ANDA"
      ) {
        message.textContent = "Publishable key belum diisi.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Memeriksa...";
      message.textContent = "";

      try {
        const endpoint = role === "admin" ? "admin-login" : "student-login";

        const payload = role === "admin"
          ? { email: identifier, password }
          : { identifier, password };

        const response = await fetch(
          SUPABASE_URL + "/functions/v1/" + endpoint,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": sb_publishable_4W8K2AIVm9DGa-4L53W0pw_VlXO3XTW
            },
            body: JSON.stringify(payload)
          }
        );

        const result = await response.json();

        if (!response.ok || !result.ok) {
          message.textContent =
            result.message || "Login gagal. Periksa data login Anda.";
          return;
        }

        if (!result.session) {
          message.textContent = "Login belum menghasilkan sesi. Silakan coba lagi.";
          return;
        }

        sessionStorage.setItem(
          "asas_session",
          JSON.stringify(result.session)
        );

        const profile = result.user || result.student || {};
        const nama = profile.full_name || profile.name || identifier;
        const nis = profile.nis || "-";
        const nisn = profile.nisn || "-";

        studentInfo.replaceChildren();

        const addLine = (label, value) => {
          const line = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = label + ": ";
          line.append(strong, document.createTextNode(String(value)));
          studentInfo.appendChild(line);
        };

        addLine("Nama", nama);
        addLine("Peran", role === "admin" ? "Administrator" : "Siswa");

        if (role === "siswa") {
          addLine("NIS", nis);
          addLine("NISN", nisn);
        }

        loginPanel.classList.add("hidden");
        dashboard.classList.remove("hidden");
      } catch (error) {
        message.textContent =
          "Tidak dapat terhubung ke server. Periksa koneksi internet dan coba lagi.";
        console.error("ASAS login error:", error);
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Masuk";
      }
    });

    document.getElementById("logoutButton").addEventListener("click", () => {
      sessionStorage.removeItem("asas_session");
      dashboard.classList.add("hidden");
      loginPanel.classList.remove("hidden");
      loginForm.reset();
      roleSelect.dispatchEvent(new Event("change"));
      message.textContent = "";
    });
  </script>
</body>
</html>
