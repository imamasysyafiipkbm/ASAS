0,1fr));gap:15px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat .label{font-size:13px;color:var(--muted);margin-bottom:10px}.stat .value{font-size:25px;font-weight:800;color:var(--navy)}.stat .hint{font-size:12px;color:#7b8798;margin-top:7px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px}.panel h3{margin:0 0 13px;font-size:17px}.panel p{color:#596579;line-height:1.65;margin:0}.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.quick-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:15px;text-align:left;color:var(--text)}.quick-btn:hover{border-color:#9bbce8;background:#f8fbff}.quick-btn strong{display:block;margin:8px 0 5px}.quick-btn span{font-size:13px;color:var(--muted);line-height:1.45}.empty-note{background:#f8fafc;border:1px dashed #cbd5e1;padding:18px;border-radius:10px;color:#667085;line-height:1.6}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}.secondary{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:11px 14px;font-weight:700;color:#344054}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:720px;background:#fff}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}th{background:#f8fafc;color:#475467;font-size:12px;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.status-off{background:#fef3f2;color:#b42318}.table-meta{color:var(--muted);font-size:13px;margin:0 0 12px}.footer{color:#8792a2;font-size:12px;text-align:center;padding:15px 0 4px}

const SUPABASE_URL = "https://mllgkysdhobmbvudpehx.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4W8K2AIVm9DGa-4L53W0pw_VlXO3XTW";
const form = document.getElementById("loginForm");
const role = document.getElementById("role");
const identifier = document.getElementById("identifier");

const message = document.getElementById("message");

function setMessage(text, type="") { message.textContent = text; message.className = "msg " + type; }
role.addEventListener("change", function () {
  const isAdmin = role.value === "admin";
  identifierLabel.textContent = isAdmin ? "Email Administrator" : "NIS atau NISN";
  identifier.placeholder = isAdmin ? "Masukkan email administrator" : "Masukkan NIS atau NISN";
  identifier.type = isAdmin ? "email" : "text";
  identifier.autocomplete = isAdmin ? "username" : "username";
  setMessage("");
});
form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const enteredId = identifier.value.trim();
  const enteredPassword = password.value;
  const selectedRole = role.value;
  if (!enteredId || !enteredPassword) { setMessage("Identitas dan kata sandi wajib diisi.", "error"); return; }
  loginButton.disabled = true; loginButton.textContent = "Memeriksa..."; setMessage("");
  try {
    const functionName = selectedRole === "admin" ? "admin-login" : "student-login";
    const requestBody = selectedRole === "admin" ? { email: enteredId, password: enteredPassword } : { identifier: enteredId, password: enteredPassword };
    const response = await fetch(SUPABASE_URL + "/functions/v1/" + functionName, {
      method: "POST", headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY }, body: JSON.stringify(requestBody)
    });
    const result = await response.json();
    if (!response.ok || !result.ok) { setMessage(result.message || "Login gagal. Periksa identitas dan kata sandi.", "error"); return; }
    if (!result.session) { setMessage("Login berhasil tetapi sesi tidak diterima. Silakan coba lagi.", "error"); return; }
    sessionStorage.setItem("asas_session", JSON.stringify(result.session));
    sessionStorage.setItem("asas_role", selectedRole);
    currentRole = selectedRole; currentUser = result.user || result.student || {};
    sessionStorage.setItem("asas_user", JSON.stringify(currentUser));
    showApp();
  } catch (error) {
    console.error(error); setMessage("Tidak dapat terhubung ke server. Periksa koneksi internet lalu coba lagi.", "error");
  } finally { loginButton.disabled = false; loginButton.textContent = "Masuk"; }
});
const pages = {
 dashboard: {title:"Dashboard",desc:"Ringkasan sistem ujian ASAS.",body:()=>`<section class="welcome-box"><h2>Selamat datang, ${escapeHtml(getUserName())}!</h2><p>Kelola data pendidikan, bank soal, jadwal, dan hasil ujian dari satu tempat. Menu sudah disiapkan. Ringkasan awal ditampilkan sesuai data yang sudah dibuat; angka akan dibuat otomatis dari database pada tahap berikutnya.</p></section><section class="stats"><div class="stat"><div class="label">Tahun Ajaran Aktif</div><div class="value" style="font-size:24px">2026/2027</div><div class="hint">Semester Ganjil</div></div><div class="stat"><div class="label">Kelas</div><div class="value">12</div><div class="hint">Paket A, B, dan C · data awal</div></div><div class="stat"><div class="label">Mata Pelajaran</div><div class="value">46</div><div class="hint">Penempatan sesuai tingkat · data awal</div></div><div class="stat"><div class="label">Siswa</div><div class="value">1</div><div class="hint">Termasuk data Siswa Uji ASAS</div></div></section><section class="panel"><h3>Akses Cepat</h3><div class="quick-grid"><button class="quick-btn" data-go="students">♙<strong>Data Siswa</strong><span>Kelola data siswa dan impor Excel/CSV.</span></button><button class="quick-btn" data-go="questions">✎<strong>Bank Soal</strong><span>Siapkan dan kelompokkan soal ujian.</span></button><button class="quick-btn" data-go="exams">▣<strong>Buat Ujian</strong><span>Atur soal, durasi, dan ketentuan ujian.</span></button></div></section>`},
 students:{title:"Data Siswa",desc:"Daftar siswa yang diambil langsung dari database Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="studentSearch" type="search" placeholder="Cari NIS, NISN, atau nama siswa..."><button id="reloadStudents" class="secondary" type="button">Muat Ulang</button></div><p id="studentMeta" class="table-meta">Menghubungkan ke database...</p><div id="studentTableArea" class="empty-note">Sedang mengambil data siswa dari Supabase.</div></section>`},
 classes:{title:"Data Kelas",desc:"Daftar kelas Paket A, Paket B, dan Paket C yang diambil dari Supabase.",body:()=>`<section class="panel"><div class="toolbar"><input id="classSearch" type="search" placeholder="Cari nama kelas atau program..."><button id="reloadClasses" class="secondary" type="button">Muat Ulang</button></div><p id="classMeta" class="table-meta">Menghubungkan ke database...</p><div id="classTableArea" class="empty-note">Sedang mengambil data kelas dari Supabase.</div></section>`},

 questions:{title:"Bank Soal",desc:"Buat dan kelola kumpulan soal berdasarkan paket, kelas, dan mata pelajaran.",body:()=>`<section class="panel"><div class="toolbar"><input id="questionBankSearch" type="search" placeholder="Cari bank soal..."/><button id="reloadQuestionBanks" class="secondary" type="button">Muat Ulang</button><button id="showAddQuestionBank" class="primary" style="width:auto;margin-top:0" type="button">+ Tambah Bank Soal</button></div><div id="questionBankFormWrap" class="hidden" style="border:1px solid var(--line);border-radius:10px;padding:18px;margin:0 0 18px"><h3>Tambah Bank Soal</h3><form id="questionBankForm"><label class="field-label" for="qbName">Nama Bank Soal *</label><input id="qbName" required maxlength="150" placeholder="Contoh: PAI Paket A Kelas 1 Semester Ganjil"><label class="field-label" for="qbProgram">Paket *</label><select id="qbProgram" required><option value="PAKET_A">Paket A</option><option value="PAKET_B">Paket B</option><option value="PAKET_C">Paket C</option></select><label class="field-label" for="qbGrade">Tingkat Kelas *</label><select id="qbGrade" required></select><label class="field-label" for="qbSubject">Mata Pelajaran *</label><select id="qbSubject" required><option value="">Memuat mata pelajaran...</option></select><label class="field-label" for="qbDescription">Keterangan</label><input id="qbDescription" maxlength="500" placeholder="Keterangan tambahan (opsional)"><div id="qbFormMessage" class="msg" role="status"></div><div class="toolbar"><button id="saveQuestionBank" class="primary" style="width:auto;margin-top:0" type="submit">Simpan Bank Soal</button><button id="cancelQuestionBank" class="secondary" type="button">Batal</button></div></form></div><p id="questionBankMeta" class="table-meta">Menghubungkan ke database...</p><div id="questionBankTableArea" class="empty-note">Sedang mengambil data bank soal dari Supabase.</div></section>
<section class="panel"><h3>Kelola Butir Soal</h3><p style="margin-bottom:14px">Pilih bank soal, lalu tambahkan soal satu per satu atau impor banyak soal dari Excel/CSV.</p>
<label class="field-label" for="questionTargetBank">Bank Soal *</label><select id="questionTargetBank"><option value="">Memuat bank soal...</option></select>
<div class="toolbar" style="margin-top:16px"><button id="toggleManualQuestion" class="primary" style="width:auto;margin-top:0" type="button">+ Ketik Soal Manual</button><button id="downloadQuestionCsv" class="secondary" type="button">Unduh Template CSV</button></div>

function escapeHtml(value){return String(value ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function getUserName(){return currentUser?.full_name || currentUser?.name || currentUser?.email || "Admin ASAS";}
function placeholder(line1,line2){return `<section class="panel"><h3>Informasi</h3><div class="empty-note">${escapeHtml(line1)}<br><br>${escapeHtml(line2)}</div></section>`;}
function renderPage(pageKey){const page=pages[pageKey]||pages.dashboard;document.querySelectorAll(".nav-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.page===pageKey));document.getElementById("mainContent").innerHTML=`<div class="crumb">ASAS / ${escapeHtml(page.title)}</div><h1 class="page-title">${escapeHtml(page.title)}</h1><p class="page-desc">${escapeHtml(page.desc)}</p>${page.body()}<div class="footer">ASAS · Sistem Ujian Berbasis Web<br>© 2026 PKBM Imam Asy-Syafi'i. Hak Cipta Dilindungi.</div>`;document.querySelectorAll("[data-go]").forEach(btn=>btn.addEventListener("click",()=>renderPage(btn.dataset.go)));if(pageKey==="students"&&currentRole==="admin")setupStudentsPage();if(pageKey==="classes"&&currentRole==="admin")setupClassesPage();if(pageKey==="subjects"&&currentRole==="admin")setupSubjectsPage();if(pageKey==="questions"&&currentRole==="admin")setupQuestionBanksPage();}

async function loadStudents(){

function drawSubjectsTable(){
 const area=document.getElementById("subjectTableArea"),meta=document.getElementById("subjectMeta");if(!area||!meta)return;
 const search=(document.getElementById("subjectSearch")?.value||"").trim().toLowerCase();
 const program=document.getElementById("subjectProgram")?.value||"";const gradeValue=document.getElementById("subjectGrade")?.value||"";const grade=gradeValue?Number(gradeValue):null;
 const normalizeProgram=value=>{
  const v=String(value??"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(["A","PA","PAKETA","PAKETA1","SD"].includes(v)||v.includes("PAKETA"))return "A";
  if(["B","PB","PAKETB","SMP"].includes(v)||v.includes("PAKETB"))return "B";
  if(["C","PC","PAKETC","SMA"].includes(v)||v.includes("PAKETC"))return "C";
  return v;
 };
 const getProgram=r=>normalizeProgram(r.program_code??r.program??r.paket??r.education_level??r.level??"");
 const getMin=r=>Number(r.grade_min??r.grade_number??r.grade??r.grade_start??r.min_grade??0);
 const getMax=r=>Number(r.grade_max??r.grade_number??r.grade??r.grade_end??r.max_grade??getMin(r));
 const rows=cachedSubjects.filter(r=>{
  const matchesSearch=!search||Object.values(r).some(v=>String(v??"").toLowerCase().includes(search));
  const rp=getProgram(r);const matchesProgram=!program||rp===program;
  const min=getMin(r),max=getMax(r);const matchesGrade=!grade||(!min&&!max)||(grade>=min&&grade<=max);
  return matchesSearch&&matchesProgram&&matchesGrade;
 });
 meta.textContent=`Menampilkan ${rows.length} dari ${cachedSubjects.length} data mata pelajaran`;
 if(!rows.length){area.className="empty-note";area.textContent=cachedSubjects.length?"Tidak ada mata pelajaran yang cocok dengan filter.":"Tabel subjects berhasil dibaca, tetapi belum berisi data.";return;}
 const keys=Object.keys(rows[0]);const preferred=["name","subject_name","nama_mata_pelajaran","program_code","grade_min","grade_max","grade_number","grade","status"];
 const hidden=["id","created_at","updated_at"];const ordered=[...preferred.filter(k=>keys.includes(k)),...keys.filter(k=>!preferred.includes(k)&&!hidden.includes(k))];
 const labels={name:"Mata Pelajaran",subject_name:"Mata Pelajaran",nama_mata_pelajaran:"Mata Pelajaran",program_code:"Paket",grade_min:"Kelas Mulai",grade_max:"Kelas Akhir",grade_number:"Kelas",grade:"Kelas",status:"Status"};
 area.className="table-wrap";area.innerHTML=`<table><thead><tr><th>No.</th>${ordered.map(k=>`<th>${escapeHtml(labels[k]||k.replaceAll("_"," "))}</th>`).join("")}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${ordered.map(k=>`<td>${escapeHtml(r[k]===null||r[k]===""?"—":typeof r[k]==="object"?JSON.stringify(r[k]):r[k])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

async function loadQuestionBankSubjects(){const select=document.getElementById("qbSubject");if(!select)return;select.innerHTML='<option value="">Memuat mata pelajaran...</option>';try{const token=getAccessToken();const response=await fetch(SUPABASE_URL+"/rest/v1/subjects?select=*&order=name.asc",{headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+token,"Accept":"application/json"}});const data=await response.json().catch(()=>[]);if(!response.ok)throw new Error(data.message||("HTTP "+response.status));cachedQBSubjects=Array.isArray(data)?data:[];filterQBSubjects();}catch(e){select.innerHTML='<option value="">Gagal memuat mata pelajaran</option>';setQBMessage("Mata pelajaran gagal dimuat: "+e.message,"error");}}
function filterQBSubjects(){const select=document.getElementById("qbSubject"),program=document.getElementById("qbProgram"),grade=document.getElementById("qbGrade");if(!select||!program||!grade)return;const p=program.value.slice(-1),g=Number(grade.value);const rows=cachedQBSubjects.filter(r=>{const code=String(r.program_code??r.program??"").toUpperCase();const rp=code.includes("PAKET_A")||code==="A"?"A":code.includes("PAKET_B")||code==="B"?"B":code.includes("PAKET_C")||code==="C"?"C":"";const min=Number(r.grade_min??r.grade_number??r.grade??0),max=Number(r.grade_max??r.grade_number??r.grade??min);return rp===p&&(!min&&!max||(g>=min&&g<=max));});select.innerHTML=rows.length?rows.map(r=>`<option value="${escapeHtml(r.id)}">${escapeHtml(r.name??r.subject_name??r.code??"Mata Pelajaran")}</option>`).join(""):'<option value="">Tidak ada mata pelajaran untuk paket/kelas ini</option>';}

function manualMessage(text,type=""){const el=document.getElementById("manualQuestionMessage");if(el){el.textContent=text;el.className="msg "+type;}}
function getRestHeaders(extra={}){return {"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+getAccessToken(),"Accept":"application/json",...extra};}
async function fillQuestionBankPicker(){const sel=document.getElementById("questionTargetBank");if(!sel)return;try{const response=await fetch(SUPABASE_URL+"/rest/v1/question_banks?select=*",{headers:getRestHeaders()});const data=await response.json().catch(()=>[]);if(!response.ok)throw new Error(data.message||"HTTP "+response.status);cachedQuestionBanks=Array.isArray(data)?data:[];sel.innerHTML=cachedQuestionBanks.length?cachedQuestionBanks.map(b=>`<option value="${escapeHtml(b.id)}">${escapeHtml(b.name??b.title??b.bank_name??"Bank Soal")}</option>`).join(""):'<option value="">Buat bank soal terlebih dahulu</option>'; if(cachedQuestionBanks.length) await loadQuestionsForBank(); }catch(e){sel.innerHTML='<option value="">Gagal memuat bank soal</option>';questionMessage("Bank soal tidak dapat dimuat: "+e.message,"error");}}
function setupQuestionEntry(){
 const manualWrap=document.getElementById("manualQuestionWrap"),toggle=document.getElementById("toggleManualQuestion"),form=document.getElementById("manualQuestionForm"),cancel=document.getElementById("cancelManualQuestion"),file=document.getElementById("questionImportFile"),previewBtn=document.getElementById("previewQuestionImport"),saveImport=document.getElementById("saveQuestionImport"),download=document.getElementById("downloadQuestionCsv");
 if(toggle)toggle.addEventListener("click",()=>manualWrap.classList.toggle("hidden"));
 if(cancel)cancel.addEventListener("click",()=>{form.reset();manualWrap.classList.add("hidden");manualMessage("");});
 if(form)form.addEventListener("submit",saveManualQuestion);
 if(file)file.addEventListener("change",()=>{pendingImportedQuestions=[];if(saveImport)saveImport.disabled=true;const meta=document.getElementById("questionImportMeta"),area=document.getElementById("questionImportPreview");if(meta)meta.textContent=file.files[0]?file.files[0].name:"Belum ada file dipilih.";if(area){area.className="empty-note";area.textContent="Klik Periksa File untuk melihat pratinjau.";}});
 if(previewBtn)previewBtn.addEventListener("click",previewQuestionImport);
 if(saveImport)saveImport.addEventListener("click",saveImportedQuestions);
 if(download)download.addEventListener("click",downloadQuestionTemplate);
 fillQuestionBankPicker();
 const bankPicker=document.getElementById("questionTargetBank"); if(bankPicker) bankPicker.addEventListener("change",loadQuestionsForBank); const reloadQ=document.getElementById("reloadQuestions"); if(reloadQ) reloadQ.addEventListener("click",loadQuestionsForBank);
}
async function insertQuestionWithOptions(row){
 const bankId=document.getElementById("questionTargetBank")?.value;if(!bankId)throw new Error("Pilih bank soal terlebih dahulu.");
 const points=Number(String(row.points??"1").replace(",","."));if(!Number.isFinite(points)||points<=0)throw new Error("Bobot Nilai harus berupa angka lebih dari 0.");
 const questionPayload={question_bank_id:bankId,question_text:row.question,question_type:"multiple_choice",points};
 const qResponse=await fetch(SUPABASE_URL+"/rest/v1/questions?select=*",{method:"POST",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=representation"}),body:JSON.stringify(questionPayload)});
 const qData=await qResponse.json().catch(()=>({}));if(!qResponse.ok)throw new Error(qData.message||qData.details||qData.hint||"Gagal menyimpan soal (HTTP "+qResponse.status+").");
 const q=Array.isArray(qData)?qData[0]:qData;if(!q?.id)throw new Error("Soal tersimpan tetapi ID soal tidak diterima.");
 const opts=["A","B","C","D","E"].map((label,i)=>({question_id:q.id,option_label:label,option_text:row[label],is_correct:label===row.key,sort_order:i+1}));
 const oResponse=await fetch(SUPABASE_URL+"/rest/v1/question_options",{method:"POST",headers:getRestHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify(opts)});
 const oData=await oResponse.json().catch(()=>({}));if(!oResponse.ok)throw new Error("Soal sudah tersimpan, tetapi pilihan jawaban gagal disimpan: "+(oData.message||oData.details||oData.hint||("HTTP "+oResponse.status))+". Catat soal ini untuk diperiksa sebelum mencoba ulang.");
}
async function saveManualQuestion(event){event.preventDefault();const btn=document.getElementById("saveManualQuestion");const row={question:document.getElementById("manualQuestionText").value.trim(),A:document.getElementById("manualOptionA").value.trim(),B:document.getElementById("manualOptionB").value.trim(),C:document.getElementById("manualOptionC").value.trim(),D:document.getElementById("manualOptionD").value.trim(),E:document.getElementById("manualOptionE").value.trim(),key:document.getElementById("manualCorrectAnswer").value,points:document.getElementById("manualPoints").value};if(!row.question||![row.A,row.B,row.C,row.D,row.E].every(Boolean)){manualMessage("Pertanyaan dan semua pilihan A–E wajib diisi.","error");return;}if(!document.getElementById("questionTargetBank").value){manualMessage("Pilih atau buat bank soal terlebih dahulu.","error");return;}btn.disabled=true;manualMessage("Menyimpan soal...");try{await insertQuestionWithOptions(row);manualMessage("Soal dan pilihan jawaban berhasil disimpan.","ok");formResetManual();}catch(e){manualMessage("Gagal menyimpan: "+e.message,"error");}finally{btn.disabled=false;}}
function formResetManual(){document.getElementById("manualQuestionForm")?.reset();if(document.getElementById("manualPoints"))document.getElementById("manualPoints").value="1";}
function normalizeImportRow(r){const get=(...keys)=>{for(const k of keys){const found=Object.keys(r).find(x=>x.trim().toLowerCase()===k.toLowerCase());if(found!==undefined&&r[found]!==null)return String(r[found]).trim();}return "";};return {no:get("No","Nomor"),question:get("Pertanyaan","Soal","Question"),A:get("A","Pilihan A"),B:get("B","Pilihan B"),C:get("C","Pilihan C"),D:get("D","Pilihan D"),E:get("E","Pilihan E"),key:get("Kunci","Kunci Jawaban","Jawaban").toUpperCase(),points:get("Bobot","Poin","Points")||"1"};}
async function previewQuestionImport(){const file=document.getElementById("questionImportFile")?.files?.[0],area=document.getElementById("questionImportPreview"),meta=document.getElementById("questionImportMeta"),save=document.getElementById("saveQuestionImport");if(!file){meta.textContent="Pilih file Excel atau CSV terlebih dahulu.";return;}if(!document.getElementById("questionTargetBank").value){meta.textContent="Pilih bank soal terlebih dahulu.";return;}try{let raw=[];const ext=file.name.split(".").pop().toLowerCase();if(ext==="csv"){const text=await file.text();raw=parseCSV(text);}else{if(!window.XLSX)throw new Error("Pembaca Excel belum termuat. Coba gunakan file CSV.");const buf=await file.arrayBuffer();const workbook=XLSX.read(buf,{type:"array"});raw=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{defval:""});}pendingImportedQuestions=raw.map(normalizeImportRow).filter(r=>r.question);const invalid=pendingImportedQuestions.filter(r=>!r.A||!r.B||!r.C||!r.D||!r.E||!["A","B","C","D","E"].includes(r.key));meta.textContent=`Ditemukan ${pendingImportedQuestions.length} soal; ${invalid.length} baris perlu diperbaiki.`;if(!pendingImportedQuestions.length)throw new Error("Tidak ditemukan baris soal. Pastikan judul kolom sesuai template.");area.className=invalid.length?"empty-note":"table-wrap";area.innerHTML=`<table><thead><tr><th>No</th><th>Pertanyaan</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>Kunci</th><th>Bobot</th><th>Status</th></tr></thead><tbody>${pendingImportedQuestions.slice(0,100).map((r,i)=>{const bad=!r.A||!r.B||!r.C||!r.D||!r.E||!["A","B","C","D","E"].includes(r.key);return `<tr><td>${escapeHtml(r.no||i+1)}</td><td>${escapeHtml(r.question)}</td><td>${escapeHtml(r.A)}</td><td>${escapeHtml(r.B)}</td><td>${escapeHtml(r.C)}</td><td>${escapeHtml(r.D)}</td><td>${escapeHtml(r.E)}</td><td>${escapeHtml(r.key)}</td><td>${escapeHtml(r.points)}</td><td>${bad?"Periksa":"Siap"}</td></tr>`}).join("")}</tbody></table>${pendingImportedQuestions.length>100?`<p class="table-meta">Pratinjau dibatasi 100 baris; semua ${pendingImportedQuestions.length} soal akan diproses.</p>`:""}`;save.disabled=invalid.length>0;questionMessage(invalid.length?"Perbaiki baris yang belum lengkap atau kunci yang bukan A/B/C/D/E.":"File lolos pemeriksaan awal. Klik Simpan Semua Soal untuk menyimpan.",invalid.length?"error":"ok");}catch(e){pendingImportedQuestions=[];save.disabled=true;area.className="empty-note";area.textContent=e.message;meta.textContent="File belum siap diimpor.";}}
function parseCSV(text){const rows=[];let row=[],field="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++;}else if(c==='"'){quoted=!quoted;}else if(c===','&&!quoted){row.push(field);field="";}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);row=[];field="";}else field+=c;}row.push(field);if(row.some(x=>String(x).trim()))rows.push(row);if(rows.length<2)return [];const headers=rows[0].map(h=>String(h).trim().replace(/^\uFEFF/,''));return rows.slice(1).map(values=>Object.fromEntries(headers.map((h,i)=>[h,values[i]??""])));}
async function saveImportedQuestions(){const btn=document.getElementById("saveQuestionImport");if(!pendingImportedQuestions.length)return;btn.disabled=true;let done=0;for(const row of pendingImportedQuestions){try{await insertQuestionWithOptions(row);done++;document.getElementById("questionImportMeta").textContent=`Menyimpan soal ${done} dari ${pendingImportedQuestions.length}...`;}catch(e){questionMessage(`Berhasil menyimpan ${done} dari ${pendingImportedQuestions.length} soal. Berhenti pada soal nomor ${row.no||done+1}: ${e.message}`,"error");btn.disabled=false;return;}}questionMessage(`Berhasil menyimpan ${done} soal ke bank soal yang dipilih.`,"ok");document.getElementById("questionImportMeta").textContent=`Selesai: ${done} soal disimpan.`;document.getElementById("questionImportPreview").className="empty-note";document.getElementById("questionImportPreview").textContent="Impor selesai.";pendingImportedQuestions=[];btn.disabled=true;}
function downloadQuestionTemplate(){const csv='No,Pertanyaan,A,B,C,D,E,Kunci,Bobot\n1,"Ibu kota Indonesia adalah …",Bandung,Jakarta,Surabaya,Medan,Jakarta,B,1\n2,"2 + 3 = …",4,5,6,7,8,B,0.5\n';const blob=new Blob(['\uFEFF',csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Template_Impor_Soal_ASAS.csv";a.click();URL.revokeObjectURL(url);}


function showApp(){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("appScreen").classList.remove("hidden");document.getElementById("rolePill").textContent=currentRole==="admin"?"Administrator":"Siswa";document.getElementById("topUser").textContent=getUserName();const sidebar=document.getElementById("sidebar");sidebar.querySelectorAll("[data-page]").forEach(btn=>{btn.classList.toggle("hidden",currentRole!=="admin"&&btn.dataset.page!=="dashboard");});renderPage("dashboard");}
document.querySelectorAll(".nav-btn").forEach(btn=>btn.addEventListener("click",()=>renderPage(btn.dataset.page)));
document.getElementById("logoutButton").addEventListener("click",function(){sessionStorage.removeItem("asas_session");sessionStorage.removeItem("asas_role");sessionStorage.removeItem("asas_user");currentUser=null;currentRole=null;document.getElementById("appScreen").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden");form.reset();role.dispatchEvent(new Event("change"));setMessage("Anda telah keluar dari sistem.","ok");});
role.dispatchEvent(new Event("change"));

// Pulihkan sesi yang tersimpan ketika halaman di-refresh.
(function restoreSession() {
  try {
    const savedSession = sessionStorage.getItem("asas_session");
    const savedRole = sessionStorage.getItem("asas_role");
    const savedUser = sessionStorage.getItem("asas_user");
    if (!savedSession || !savedRole) return;

    const parsedSession = JSON.parse(savedSession);
    if (!parsedSession || !parsedSession.access_token) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    // Jika waktu kedaluwarsa tersedia dan sudah lewat, minta login kembali.
    const expiresAt = parsedSession.expires_at;
    if (expiresAt && Date.now() >= Number(expiresAt) * 1000) {
      sessionStorage.removeItem("asas_session");
      sessionStorage.removeItem("asas_role");
      sessionStorage.removeItem("asas_user");
      return;
    }

    currentRole = savedRole;
    currentUser = savedUser ? JSON.parse(savedUser) : {};
    showApp();
  } catch (error) {
    console.error("Tidak dapat memulihkan sesi ASAS:", error);
    sessionStorage.removeItem("asas_session");
    sessionStorage.removeItem("asas_role");
    sessionStorage.removeItem("asas_user");
  }
})();
</script>
